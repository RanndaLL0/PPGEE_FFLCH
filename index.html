ntização.","concluir o texto.","expressar uma condição."],"a":1,"e":"'In turn' = por sua vez."},{"t":0,"s":"A palavra *trade-off* (parágrafo 4) significa:","o":["compromisso entre fatores conflitantes.","vantagem absoluta.","erro de cálculo.","troca de equipamentos."],"a":0,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, os filtros digitais são usados para:","o":["substituir amostradores.","converter sinais digitais em analógicos.","remover ruído, separar bandas de frequência e moldar o espectro.","aumentar o número de bits."],"a":2,"e":""},{"t":1,"s":"A expressão *ranging from audio equipment to biomedical instruments* indica:","o":["que os filtros são usados apenas em áudio.","uma ordem cronológica de invenções.","a variedade de aplicações dos filtros digitais.","que os instrumentos biomédicos dispensam filtros."],"a":2,"e":""},{"t":1,"s":"De acordo com o parágrafo 2, os filtros FIR calculam cada amostra de saída como:","o":["um valor aleatório.","uma resposta infinita ao impulso.","uma soma ponderada de um número finito de amostras de entrada.","uma combinação de saídas anteriores."],"a":2,"e":""},{"t":1,"s":"Segundo o Texto 2, a resposta ao impulso dos filtros IIR pode, teoricamente, durar para sempre porque:","o":["eles também utilizam amostras de saída anteriores.","têm fase linear.","são sempre estáveis.","usam apenas amostras de entrada."],"a":0,"e":""},{"t":1,"s":"De acordo com o parágrafo 3, a fase linear dos filtros FIR:","o":["aumenta a carga computacional sem benefícios.","causa instabilidade.","preserva a forma das ondas.","distorce o sinal."],"a":2,"e":""},{"t":1,"s":"Segundo o Texto 2, a eletrocardiografia é citada como exemplo de aplicação em que:","o":["não se usam filtros digitais.","distorções da forma de onda podem levar a diagnósticos incorretos.","filtros IIR são obrigatórios.","a fase não tem importância."],"a":1,"e":""},{"t":1,"s":"No parágrafo 3, a expressão *by contrast* contrapõe:","o":["o áudio à biomedicina.","a estabilidade à fase linear.","os coeficientes às amostras.","as características dos filtros IIR às dos filtros FIR."],"a":3,"e":""},{"t":1,"s":"Segundo o Texto 2, os filtros IIR podem obter resposta em frequência abrupta:","o":["apenas em aplicações de áudio.","com mais coeficientes que os FIR.","sem risco de instabilidade.","com muito menos coeficientes, reduzindo a carga computacional."],"a":3,"e":""},{"t":1,"s":"De acordo com o parágrafo 4, a principal desvantagem dos filtros IIR é que:","o":["podem se tornar instáveis, especialmente com coeficientes de precisão limitada.","exigem mais coeficientes.","não podem separar bandas de frequência.","têm sempre fase linear."],"a":0,"e":""},{"t":1,"s":"Segundo o parágrafo 4, os projetistas devem verificar se:","o":["todos os polos do filtro permanecem dentro do círculo unitário após a quantização.","a frequência de amostragem é suficiente.","o filtro tem fase linear.","os zeros estão fora do círculo unitário."],"a":0,"e":""}],"w":["Em inglês, explique o que é aliasing e como ele pode ser evitado em um sistema de aquisição de dados.","Em inglês, compare filtros FIR e IIR e indique qual você escolheria para processar sinais de eletrocardiograma, justificando."]},{"t":"Sistemas de controle","en":"Feedback control and PID","x":[{"h":"Why Feedback Matters","p":["Control engineering is concerned with making systems behave as desired despite uncertainties and disturbances. A thermostat that keeps a room at a constant temperature, an autopilot that maintains the altitude of an aircraft and a regulator that holds the voltage of a generator are all examples of control systems.","In an open-loop system, the controller acts without measuring the result of its action. A simple toaster, for instance, heats the bread for a fixed time regardless of how brown it becomes. Such systems are inexpensive, but they cannot compensate for changes in the process or for external disturbances.","Closed-loop systems, by contrast, continuously compare the measured output with the desired value, called the reference or setpoint. The difference between them, known as the error, is used to compute the control action. Feedback therefore makes the system less sensitive to variations in its parameters and allows it to reject disturbances.","Feedback, however, is not free of risks. If the controller reacts too strongly or with too much delay, the system may oscillate and even become unstable. For this reason, stability analysis, using tools such as the Nyquist criterion or root locus, is a fundamental step in the design of any feedback system."]},{"h":"The PID Controller","p":["The proportional-integral-derivative (PID) controller is by far the most widely used control algorithm in industry. It is estimated that more than 90% of control loops in process plants use some form of PID control.","Each of the three terms has a specific function. The proportional term produces an action proportional to the current error. The integral term accumulates past errors and eliminates the steady-state error, while the derivative term anticipates future behavior by reacting to the rate of change of the error, which tends to improve damping.","Tuning a PID controller consists of choosing the gains of the three terms. Classical methods, such as the Ziegler-Nichols rules, provide initial values based on simple experiments. Nevertheless, these values often lead to aggressive responses and usually need to be refined manually.","In practice, several modifications are required. Because the derivative term amplifies high-frequency noise, it is generally combined with a low-pass filter. In addition, when the actuator saturates, the integral term may continue to grow, a phenomenon called integrator windup, which causes large overshoots. Anti-windup schemes are therefore included in virtually all industrial implementations."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, a engenharia de controle tem como objetivo:","o":["fazer os sistemas se comportarem como desejado apesar de incertezas e perturbações.","projetar apenas termostatos.","aumentar as perturbações externas.","eliminar todos os sistemas automáticos."],"a":0,"e":""},{"t":0,"s":"Assinale a alternativa que NÃO é citada no parágrafo 1 como exemplo de sistema de controle:","o":["um termostato.","um motor de combustão interna.","um piloto automático.","um regulador de tensão de gerador."],"a":1,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, em um sistema em malha aberta:","o":["as perturbações são compensadas automaticamente.","o controlador age sem medir o resultado de sua ação.","o erro é medido continuamente.","a saída é comparada com a referência."],"a":1,"e":""},{"t":0,"s":"A torradeira simples é mencionada no texto como exemplo de:","o":["sistema em malha fechada.","controlador PID.","sistema instável.","sistema em malha aberta."],"a":3,"e":""},{"t":0,"s":"A palavra *regardless* em 'regardless of how brown it becomes' significa:","o":["de acordo com.","independentemente de.","antes de.","por causa de."],"a":1,"e":""},{"t":0,"s":"Segundo o parágrafo 3, o erro é definido como:","o":["a ação de controle.","a soma das perturbações.","a diferença entre a saída medida e o valor desejado.","o valor de referência."],"a":2,"e":""},{"t":0,"s":"De acordo com o Texto 1, a realimentação:","o":["só funciona em malha aberta.","aumenta a sensibilidade a variações de parâmetros.","torna o sistema menos sensível a variações de parâmetros e permite rejeitar perturbações.","elimina a necessidade de análise de estabilidade."],"a":2,"e":""},{"t":0,"s":"No parágrafo 4, a expressão *is not free of risks* significa que a realimentação:","o":["é proibida em alguns casos.","é totalmente segura.","também apresenta riscos.","não tem custo."],"a":2,"e":""},{"t":0,"s":"Segundo o parágrafo 4, o sistema pode oscilar e tornar-se instável se o controlador:","o":["usar o critério de Nyquist.","medir a saída continuamente.","tiver baixo ganho.","reagir com intensidade excessiva ou com muito atraso."],"a":3,"e":""},{"t":0,"s":"No parágrafo 4, *For this reason* introduz:","o":["uma exceção à regra.","uma comparação entre métodos.","a conclusão de que a análise de estabilidade é fundamental.","um exemplo de sistema instável."],"a":2,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, o controlador PID:","o":["é usado apenas em laboratórios.","é usado em menos de 10% das malhas.","foi substituído por técnicas modernas.","é de longe o algoritmo de controle mais usado na indústria."],"a":3,"e":""},{"t":1,"s":"A expressão *by far* (parágrafo 1) intensifica a ideia de que o PID é:","o":["muito mais utilizado que os demais algoritmos.","um algoritmo distante da prática.","pouco utilizado.","um método recente."],"a":0,"e":""},{"t":1,"s":"De acordo com o parágrafo 2, o termo integral:","o":["acumula erros passados e elimina o erro em regime permanente.","antecipa o comportamento futuro.","produz ação proporcional ao erro atual.","amplifica ruídos de alta frequência."],"a":0,"e":""},{"t":1,"s":"Segundo o Texto 2, o termo derivativo:","o":["reage à taxa de variação do erro e tende a melhorar o amortecimento.","acumula erros passados.","é imune ao ruído.","elimina o erro em regime permanente."],"a":0,"e":""},{"t":1,"s":"No parágrafo 2, a palavra *while* expressa:","o":["causa.","contraste entre as funções dos termos.","condição.","tempo cronológico."],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 3, o método de Ziegler-Nichols:","o":["é usado apenas no termo derivativo.","fornece valores iniciais que geralmente precisam ser refinados manualmente.","fornece os ganhos ótimos definitivos.","dispensa experimentos."],"a":1,"e":""},{"t":1,"s":"A palavra *aggressive* (parágrafo 3), referindo-se às respostas, sugere respostas:","o":["sem erro.","perfeitamente amortecidas.","bruscas, com oscilações ou sobressinal elevado.","lentas e suaves."],"a":2,"e":""},{"t":1,"s":"De acordo com o parágrafo 4, o termo derivativo é normalmente combinado com um filtro passa-baixas porque:","o":["satura o atuador.","reduz o amortecimento.","elimina o erro em regime permanente.","amplifica ruídos de alta frequência."],"a":3,"e":""},{"t":1,"s":"Segundo o Texto 2, o *integrator windup* ocorre quando:","o":["o ganho proporcional é zero.","o erro é sempre nulo.","o termo derivativo é filtrado.","o atuador satura e o termo integral continua crescendo."],"a":3,"e":""},{"t":1,"s":"A expressão *virtually all* (parágrafo 4) significa:","o":["praticamente todas.","algumas poucas.","apenas as simuladas.","virtualmente nenhuma."],"a":0,"e":"'Virtually' = praticamente."}],"w":["Em inglês, explique a diferença entre sistemas de controle em malha aberta e em malha fechada, dando um exemplo de cada.","Em inglês, descreva a função de cada termo de um controlador PID e mencione um problema prático de sua implementação."]},{"t":"Microeletrônica e escalonamento CMOS","en":"CMOS scaling and Moore's law","x":[{"h":"The End of Easy Scaling","p":["In 1965, Gordon Moore observed that the number of transistors on an integrated circuit was doubling approximately every year, a rate he later revised to every two years. This observation, known as Moore's law, guided the semiconductor industry for half a century and made possible the extraordinary growth of computing power.","For decades, shrinking transistors brought benefits on all fronts. According to Dennard scaling, as transistor dimensions were reduced, the supply voltage could be lowered proportionally, so that power density remained constant. Smaller transistors were therefore faster, cheaper and more energy-efficient at the same time.","Around 2005, however, Dennard scaling broke down. Because the threshold voltage could not be reduced further without causing unacceptable leakage currents, the supply voltage stopped decreasing. As a consequence, clock frequencies stagnated, and manufacturers turned to multicore processors to continue increasing performance.","Today, transistor dimensions approach just a few nanometers, and quantum effects such as tunneling have become significant. Furthermore, the cost of building a state-of-the-art fabrication plant now exceeds tens of billions of dollars. Although Moore's law has not completely ended, its pace has clearly slowed."]},{"h":"New Transistor Architectures","p":["As planar transistors were scaled down, the gate gradually lost control over the channel. Electrons could flow between source and drain even when the transistor was supposed to be off, increasing static power consumption. This problem, known as the short-channel effect, required a fundamental change in device structure.","The answer was the FinFET, introduced in commercial processors in 2011. In a FinFET, the channel is a thin vertical fin, and the gate wraps around it on three sides. This geometry provides much better electrostatic control and significantly reduces leakage.","The next step is the gate-all-around (GAA) transistor, in which the gate completely surrounds stacked horizontal nanosheets. Besides improving control even further, this structure allows designers to adjust the width of the sheets to balance performance and power consumption.","Beyond new geometries, researchers are exploring alternative approaches, such as stacking chips vertically and integrating several smaller dies, called chiplets, in a single package. These strategies suggest that, even if transistors stop shrinking, the performance of electronic systems may continue to improve for many years."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, Gordon Moore observou em 1965 que:","o":["o silício seria substituído em breve.","a frequência de clock dobrava a cada dois anos.","o número de transistores em um circuito integrado dobrava aproximadamente a cada ano.","os transistores ficariam mais caros a cada ano."],"a":2,"e":""},{"t":0,"s":"De acordo com o texto, Moore posteriormente revisou a taxa para:","o":["a cada dois anos.","a cada cinco anos.","a cada década.","a cada seis meses."],"a":0,"e":""},{"t":0,"s":"Segundo o parágrafo 2, de acordo com o escalonamento de Dennard:","o":["a densidade de potência aumentava com a redução dos transistores.","a tensão de alimentação aumentava.","a tensão de alimentação podia ser reduzida proporcionalmente, mantendo a densidade de potência constante.","os transistores menores eram mais lentos."],"a":2,"e":""},{"t":0,"s":"A expressão *on all fronts* (parágrafo 2) indica benefícios:","o":["em nenhum aspecto.","em todos os aspectos.","apenas no custo.","apenas na velocidade."],"a":1,"e":""},{"t":0,"s":"De acordo com o parágrafo 3, a tensão de alimentação parou de diminuir porque:","o":["a tensão de limiar não podia ser reduzida sem causar correntes de fuga inaceitáveis.","os transistores ficaram maiores.","a frequência de clock aumentou.","os processadores multinúcleo exigiam mais tensão."],"a":0,"e":""},{"t":0,"s":"Segundo o Texto 1, os fabricantes adotaram processadores multinúcleo para:","o":["aumentar a frequência de clock.","eliminar as correntes de fuga.","reduzir o número de transistores.","continuar aumentando o desempenho."],"a":3,"e":""},{"t":0,"s":"A expressão *broke down* (parágrafo 3) significa que o escalonamento de Dennard:","o":["foi criado.","deixou de valer.","foi reforçado.","foi acelerado."],"a":1,"e":""},{"t":0,"s":"Segundo o parágrafo 4, nas dimensões atuais:","o":["efeitos quânticos como o tunelamento tornaram-se significativos.","a lei de Moore acelerou.","a fabricação ficou mais barata.","efeitos quânticos são desprezíveis."],"a":0,"e":""},{"t":0,"s":"A palavra *exceeds* (parágrafo 4) significa:","o":["financia","iguala","ultrapassa","reduz"],"a":2,"e":""},{"t":0,"s":"Qual afirmação resume a conclusão do Texto 1?","o":["A lei de Moore acelerou nos últimos anos.","A lei de Moore nunca foi válida.","A lei de Moore terminou em 2005.","A lei de Moore não terminou completamente, mas seu ritmo diminuiu claramente."],"a":3,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, o efeito de canal curto consiste em:","o":["o aumento da velocidade do transistor.","o aumento da área do transistor.","o gate perder controle sobre o canal, permitindo fluxo de elétrons mesmo com o transistor desligado.","a redução do consumo de potência estática."],"a":2,"e":""},{"t":1,"s":"No parágrafo 1, *was supposed to be off* significa que o transistor:","o":["foi destruído.","foi removido.","estava ligado intencionalmente.","deveria estar desligado."],"a":3,"e":""},{"t":1,"s":"De acordo com o parágrafo 2, no FinFET:","o":["o canal é plano.","não há controle eletrostático.","o gate envolve o canal em três lados.","o gate envolve totalmente nanofolhas empilhadas."],"a":2,"e":""},{"t":1,"s":"Segundo o Texto 2, o FinFET foi introduzido em processadores comerciais em:","o":["2005","1965","2021","2011"],"a":3,"e":""},{"t":1,"s":"De acordo com o parágrafo 3, no transistor GAA:","o":["o gate envolve completamente nanofolhas horizontais empilhadas.","o canal é uma aleta vertical.","as nanofolhas têm largura fixa.","o gate atua apenas em um lado do canal."],"a":0,"e":""},{"t":1,"s":"A palavra *Besides* (parágrafo 3) pode ser traduzida por:","o":["Em vez de","Além de","Por causa de","Apesar de"],"a":1,"e":""},{"t":1,"s":"Segundo o Texto 2, ajustar a largura das nanofolhas permite:","o":["eliminar o gate.","aumentar o efeito de canal curto.","reduzir o número de chips.","equilibrar desempenho e consumo de potência."],"a":3,"e":""},{"t":1,"s":"De acordo com o parágrafo 4, *chiplets* são:","o":["fábricas de semicondutores.","pequenos dies integrados em um único encapsulamento.","processadores de núcleo único.","transistores planares antigos."],"a":1,"e":""},{"t":1,"s":"No parágrafo 4, a expressão *even if* indica:","o":["causa (porque).","concessão hipotética (mesmo que).","tempo (quando).","finalidade (para que)."],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 4, mesmo que os transistores parem de diminuir:","o":["o desempenho dos sistemas eletrônicos poderá continuar melhorando.","a indústria deixará de pesquisar.","o desempenho certamente diminuirá.","os chiplets serão abandonados."],"a":0,"e":""}],"w":["Em inglês, explique o que foi o escalonamento de Dennard e o que aconteceu quando ele deixou de valer.","Em inglês, descreva como as novas arquiteturas de transistores (FinFET e GAA) ajudam a enfrentar os limites da miniaturização."]},{"t":"Inteligência artificial em sistemas de potência","en":"Machine learning for power systems","x":[{"h":"Learning from Grid Data","p":["Modern power systems generate enormous amounts of data. Phasor measurement units (PMUs), for example, record voltage and current phasors up to 60 times per second, synchronized by GPS signals. Smart meters, weather stations and equipment sensors add further streams of information.","Machine learning (ML) techniques are increasingly used to extract useful knowledge from these data. One of the most successful applications is load forecasting. Neural networks trained on historical consumption, temperature and calendar information can predict demand with errors of only a few percent, helping operators schedule generation more economically.","ML is also being applied to renewable generation forecasting, equipment maintenance and fault detection. In predictive maintenance, algorithms analyze signals such as vibration, temperature and dissolved gases in transformer oil in order to identify early signs of failure. This allows utilities to repair equipment before it breaks down, avoiding costly outages.","Nevertheless, the adoption of ML in critical operations remains cautious. Power systems must operate safely at all times, and operators are reluctant to rely on models whose decisions they cannot understand. This concern has stimulated research on explainable artificial intelligence, which aims to make the reasoning of models transparent to human users."]},{"h":"Data-Driven Fault Classification","p":["When a short circuit occurs on a transmission line, protection systems must identify the fault and isolate the affected section within a fraction of a second. Conventional relays rely on fixed thresholds and physical models of the line. Data-driven methods, in contrast, learn the characteristics of each fault type from examples.","A typical approach consists of extracting features from the voltage and current waveforms recorded during the fault, for instance using the wavelet transform, and then feeding these features into a classifier. Convolutional neural networks have also been used to process the raw waveforms directly, eliminating the need for manual feature extraction.","One major difficulty is the scarcity of real fault records. Faults are relatively rare, and utilities do not always share their data. Researchers therefore generate most of their training data with electromagnetic transient simulations. However, a model that performs well on simulated data may fail when exposed to real measurements, which contain noise and conditions not represented in the simulations.","To address this gap, recent studies combine simulated and field data and test models under a wide range of operating conditions. Only after such thorough validation can data-driven methods be trusted to complement conventional protection."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, as unidades de medição fasorial (PMUs):","o":["substituem os medidores inteligentes.","medem a temperatura dos transformadores.","registram dados uma vez por hora.","registram fasores de tensão e corrente até 60 vezes por segundo, sincronizadas por GPS."],"a":3,"e":""},{"t":0,"s":"No parágrafo 1, a palavra *further* em 'add further streams of information' significa:","o":["distantes","antigos","menores","adicionais"],"a":3,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, as redes neurais para previsão de carga são treinadas com:","o":["dados históricos de consumo, temperatura e calendário.","apenas dados de PMUs.","dados de manutenção de equipamentos.","imagens de satélite."],"a":0,"e":""},{"t":0,"s":"Segundo o Texto 1, a previsão de carga precisa ajuda os operadores a:","o":["reparar transformadores.","eliminar a geração renovável.","aumentar o consumo.","programar a geração de forma mais econômica."],"a":3,"e":""},{"t":0,"s":"De acordo com o parágrafo 3, a manutenção preditiva analisa sinais como:","o":["vibração, temperatura e gases dissolvidos no óleo de transformadores.","imagens de câmeras de segurança.","preço da energia e demanda.","dados de calendário."],"a":0,"e":""},{"t":0,"s":"No parágrafo 3, *before it breaks down*, o pronome *it* refere-se:","o":["ao óleo.","ao algoritmo.","ao equipamento.","à concessionária."],"a":2,"e":""},{"t":0,"s":"Segundo o parágrafo 4, a adoção de ML em operações críticas é cautelosa porque:","o":["não há dados disponíveis.","os modelos são sempre imprecisos.","os operadores relutam em confiar em modelos cujas decisões não entendem.","o ML é proibido por lei."],"a":2,"e":""},{"t":0,"s":"A palavra *reluctant* (parágrafo 4) significa:","o":["relutantes","acostumados","obrigados","ansiosos"],"a":0,"e":""},{"t":0,"s":"De acordo com o Texto 1, a inteligência artificial explicável busca:","o":["reduzir a quantidade de dados.","tornar transparente o raciocínio dos modelos para os usuários.","substituir os operadores humanos.","aumentar a velocidade dos modelos."],"a":1,"e":""},{"t":0,"s":"A palavra *Nevertheless* (parágrafo 4) introduz:","o":["uma conclusão favorável.","um novo exemplo de aplicação.","uma ressalva em relação às aplicações descritas.","uma definição técnica."],"a":2,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, os relés convencionais baseiam-se em:","o":["limiares fixos e modelos físicos da linha.","transformada wavelet.","redes neurais convolucionais.","exemplos de faltas anteriores."],"a":0,"e":""},{"t":1,"s":"A expressão *within a fraction of a second* (parágrafo 1) significa:","o":["a cada segundo.","em uma fração de segundo.","após alguns segundos.","em um segundo exato."],"a":1,"e":""},{"t":1,"s":"De acordo com o parágrafo 2, uma abordagem típica consiste em:","o":["usar apenas relés convencionais.","medir apenas a frequência da rede.","desligar a linha antes da falta.","extrair características das formas de onda e alimentá-las em um classificador."],"a":3,"e":""},{"t":1,"s":"Segundo o Texto 2, as redes neurais convolucionais:","o":["usam apenas dados de campo.","podem processar diretamente as formas de onda brutas, dispensando extração manual de características.","não podem ser usadas em proteção.","exigem extração manual de características."],"a":1,"e":""},{"t":1,"s":"De acordo com o parágrafo 3, uma grande dificuldade é:","o":["a velocidade dos relés.","a escassez de registros reais de faltas.","o excesso de dados de campo.","o custo das simulações."],"a":1,"e":""},{"t":1,"s":"A palavra *scarcity* (parágrafo 3) significa:","o":["escassez","abundância","qualidade","segurança"],"a":0,"e":""},{"t":1,"s":"Segundo o Texto 2, a maior parte dos dados de treinamento é gerada:","o":["por medições em campo.","por medidores inteligentes.","por simulações de transitórios eletromagnéticos.","por relés convencionais."],"a":2,"e":""},{"t":1,"s":"De acordo com o parágrafo 3, um modelo treinado com dados simulados pode falhar com medições reais porque estas:","o":["são sempre incompletas.","não possuem ruído.","são idênticas aos dados simulados.","contêm ruído e condições não representadas nas simulações."],"a":3,"e":""},{"t":1,"s":"No parágrafo 4, *To address this gap*, *this gap* refere-se:","o":["à falta de concessionárias.","à diferença entre o desempenho em dados simulados e em dados reais.","ao número de classificadores.","ao tempo de atuação dos relés."],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 4, os métodos baseados em dados poderão ser confiáveis para:","o":["substituir imediatamente toda a proteção convencional.","dispensar testes.","complementar a proteção convencional, após validação rigorosa.","eliminar as simulações."],"a":2,"e":""}],"w":["Em inglês, descreva duas aplicações de aprendizado de máquina em sistemas elétricos de potência mencionadas no texto.","Em inglês, discuta por que operadores de sistemas elétricos podem hesitar em confiar em modelos de inteligência artificial em operações críticas."]},{"t":"Engenharia biomédica","en":"Biosignals and brain-computer interfaces","x":[{"h":"Recording the Electrical Activity of the Body","p":["The human body is an electrical system. The heart, the muscles and the brain all produce electrical signals that can be measured on the surface of the skin. The electrocardiogram (ECG), the electromyogram (EMG) and the electroencephalogram (EEG) are among the most important tools in clinical diagnosis.","These signals, however, are extremely weak. While the ECG has an amplitude of about one millivolt, the EEG measured on the scalp is typically in the range of tens of microvolts. Consequently, biopotential amplifiers must have very high gain and, above all, a high common-mode rejection ratio, because interference from power lines can be thousands of times larger than the signal of interest.","Electrodes are another critical element. Conventional wet electrodes use a conductive gel to reduce the impedance between the skin and the sensor. Although they provide good signal quality, the gel dries out over time and its application is uncomfortable. Dry electrodes avoid these problems but are more susceptible to motion artifacts.","Advances in low-power electronics and wireless communication have made it possible to record biosignals continuously outside hospitals. Wearable devices can now monitor heart rhythm for weeks, allowing physicians to detect irregularities that might be missed in a short examination."]},{"h":"Brain-Computer Interfaces","p":["A brain-computer interface (BCI) is a system that translates brain activity into commands for external devices, such as computers, wheelchairs or robotic arms. Its main motivation is to restore communication and mobility to people with severe motor disabilities.","BCIs can be invasive or non-invasive. Invasive interfaces use electrodes implanted in the brain, which provide signals with high spatial resolution and low noise. Their use, nonetheless, involves surgical risks. Non-invasive systems, usually based on EEG, are safer and cheaper, but the signals they record are attenuated and blurred by the skull.","Several paradigms are used in non-invasive BCIs. In motor imagery, the user imagines moving a hand or a foot, which produces characteristic changes in the rhythms of the motor cortex. In the steady-state visually evoked potential paradigm, the user looks at one of several targets flickering at different frequencies, and the system identifies the target by detecting that frequency in the EEG.","Despite remarkable progress, BCIs still face practical limitations. Users often need long training sessions, and the performance of the system may vary considerably from one day to another. Machine learning methods capable of adapting to each user are therefore an active field of research."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, o ECG, o EMG e o EEG são:","o":["tipos de eletrodos.","interfaces cérebro-computador.","ferramentas importantes no diagnóstico clínico.","amplificadores de biopotencial."],"a":2,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, o EEG medido no couro cabeludo tem amplitude típica:","o":["na faixa de dezenas de microvolts.","de cerca de um milivolt.","de alguns volts.","maior que a do ECG."],"a":0,"e":""},{"t":0,"s":"No parágrafo 2, a palavra *While* estabelece:","o":["uma comparação/contraste entre as amplitudes do ECG e do EEG.","uma condição.","uma finalidade.","uma relação de tempo."],"a":0,"e":""},{"t":0,"s":"Segundo o Texto 1, os amplificadores de biopotencial precisam de alta razão de rejeição de modo comum porque:","o":["o ganho deve ser baixo.","a interferência da rede elétrica pode ser milhares de vezes maior que o sinal de interesse.","os sinais biológicos são muito fortes.","os eletrodos secos não funcionam."],"a":1,"e":""},{"t":0,"s":"A expressão *above all* (parágrafo 2) significa:","o":["em todos os casos","sobretudo","acima do limite","ao todo"],"a":1,"e":""},{"t":0,"s":"De acordo com o parágrafo 3, os eletrodos úmidos:","o":["dispensam o uso de gel.","são mais suscetíveis a artefatos de movimento.","são mais confortáveis.","usam gel condutor para reduzir a impedância entre pele e sensor."],"a":3,"e":""},{"t":0,"s":"Segundo o parágrafo 3, uma desvantagem dos eletrodos úmidos é que:","o":["fornecem sinal de baixa qualidade.","são mais caros que os amplificadores.","o gel seca com o tempo e sua aplicação é desconfortável.","não podem medir o ECG."],"a":2,"e":""},{"t":0,"s":"De acordo com o Texto 1, os eletrodos secos:","o":["não sofrem com movimento.","usam gel condutor.","fornecem sempre melhor sinal.","são mais suscetíveis a artefatos de movimento."],"a":3,"e":""},{"t":0,"s":"Segundo o parágrafo 4, os dispositivos vestíveis permitem:","o":["eliminar exames clínicos.","substituir os médicos.","realizar cirurgias remotas.","monitorar o ritmo cardíaco por semanas fora do hospital."],"a":3,"e":""},{"t":0,"s":"No parágrafo 4, *might be missed* indica que as irregularidades:","o":["poderiam passar despercebidas em um exame curto.","são causadas pelos dispositivos.","não existem.","sempre são detectadas."],"a":0,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, uma interface cérebro-computador (BCI):","o":["é um tipo de cadeira de rodas.","traduz a atividade cerebral em comandos para dispositivos externos.","mede apenas a atividade cardíaca.","substitui o cérebro humano."],"a":1,"e":""},{"t":1,"s":"De acordo com o Texto 2, a principal motivação das BCIs é:","o":["substituir o teclado em escritórios.","estudar o crânio humano.","restaurar comunicação e mobilidade a pessoas com deficiências motoras graves.","criar jogos de computador."],"a":2,"e":""},{"t":1,"s":"Segundo o parágrafo 2, as interfaces invasivas:","o":["não exigem cirurgia.","baseiam-se em EEG.","fornecem sinais com alta resolução espacial e baixo ruído, mas envolvem riscos cirúrgicos.","são mais seguras e mais baratas."],"a":2,"e":""},{"t":1,"s":"A palavra *nonetheless* (parágrafo 2) pode ser substituída por:","o":["however","therefore","moreover","for example"],"a":0,"e":""},{"t":1,"s":"De acordo com o Texto 2, os sinais registrados por sistemas não invasivos são:","o":["isentos de ruído.","obtidos por eletrodos implantados.","mais nítidos que os invasivos.","atenuados e borrados pelo crânio."],"a":3,"e":""},{"t":1,"s":"No parágrafo 2, *the signals they record*, o pronome *they* refere-se:","o":["aos sistemas não invasivos.","aos pacientes.","aos riscos cirúrgicos.","aos eletrodos implantados."],"a":0,"e":""},{"t":1,"s":"Segundo o parágrafo 3, no paradigma de imagética motora, o usuário:","o":["fala comandos em voz alta.","olha para alvos piscando em frequências diferentes.","move fisicamente o braço robótico.","imagina mover uma mão ou um pé."],"a":3,"e":""},{"t":1,"s":"No paradigma SSVEP descrito no parágrafo 3, o sistema identifica o alvo:","o":["pela imaginação de movimentos.","por um teclado virtual.","detectando no EEG a frequência em que o alvo pisca.","pelo movimento dos olhos registrado em vídeo."],"a":2,"e":""},{"t":1,"s":"Segundo o parágrafo 4, uma limitação prática das BCIs é que:","o":["os usuários não precisam de treinamento.","o desempenho pode variar bastante de um dia para outro.","não usam aprendizado de máquina.","são sempre invasivas."],"a":1,"e":""},{"t":1,"s":"A expressão *Despite remarkable progress* (parágrafo 4) significa:","o":["Por causa do progresso notável","Apesar do progresso notável","Antes do progresso","Sem nenhum progresso"],"a":1,"e":""}],"w":["Em inglês, explique por que medir sinais como o EEG é um desafio do ponto de vista da instrumentação eletrônica.","Em inglês, compare interfaces cérebro-computador invasivas e não invasivas, apresentando vantagens e desvantagens de cada uma."]},{"t":"Proteção de sistemas elétricos","en":"Power system protection","x":[{"h":"The Silent Guardians of the Grid","p":["Faults are inevitable in power systems. Lightning strikes, falling trees, insulation failures and equipment malfunctions can all create short circuits, in which currents may reach many times their normal values. If these currents are not interrupted quickly, they can destroy equipment, start fires and endanger human lives.","Protection systems are designed to detect faults and disconnect the faulted component as rapidly as possible. They consist of instrument transformers, which reduce currents and voltages to measurable levels, relays, which decide whether a fault has occurred, and circuit breakers, which physically interrupt the current.","A good protection scheme must satisfy several requirements. It must be selective, that is, it should disconnect only the faulted part of the system, leaving the rest in operation. It must also be reliable, which includes two aspects: dependability, the ability to operate when required, and security, the ability to avoid operating when it should not.","These two aspects frequently conflict with each other. A relay set to be extremely sensitive will rarely fail to detect a fault, but it may trip unnecessarily during normal disturbances, such as the inrush current of a transformer. Protection engineers must therefore find an adequate compromise for each application."]},{"h":"Distance Protection of Transmission Lines","p":["Distance relays are the main protection of most high-voltage transmission lines. Rather than measuring current alone, they calculate the apparent impedance seen from the relay location, which is the ratio between the measured voltage and current. Since the impedance of a line is roughly proportional to its length, this quantity indicates how far away the fault is.","To provide selectivity, distance relays use several zones. Zone 1 typically covers 80% to 85% of the line and trips without intentional delay. The remaining portion is not included in order to avoid tripping for faults on the next line, given the errors in measurements and line parameters. Zone 2 covers the whole line plus part of the adjacent one and operates with a short time delay.","Distance relays may be affected by several factors. The fault resistance, for example, adds to the measured impedance and can make a fault appear farther than it really is. Power swings, which are oscillations following major disturbances, may also move the apparent impedance into the tripping zones even when there is no fault.","To overcome these limitations, relays at both ends of a line can exchange information through communication channels. Such teleprotection schemes allow the entire line to be cleared at high speed."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, durante um curto-circuito as correntes podem:","o":["inverter a frequência da rede.","permanecer inalteradas.","cair a zero.","atingir muitas vezes seus valores normais."],"a":3,"e":""},{"t":0,"s":"Assinale a alternativa que NÃO é mencionada no parágrafo 1 como causa de faltas:","o":["sobrecarga causada por excesso de consumidores.","queda de árvores.","descargas atmosféricas.","falhas de isolamento."],"a":0,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, os relés têm a função de:","o":["interromper fisicamente a corrente.","decidir se ocorreu uma falta.","reduzir correntes a níveis mensuráveis.","gerar energia de reserva."],"a":1,"e":""},{"t":0,"s":"Segundo o Texto 1, os disjuntores (*circuit breakers*):","o":["calculam a impedância.","medem tensões.","decidem se houve falta.","interrompem fisicamente a corrente."],"a":3,"e":""},{"t":0,"s":"De acordo com o parágrafo 3, um sistema de proteção seletivo:","o":["nunca atua.","desliga todo o sistema em qualquer falta.","atua apenas com atraso intencional.","desconecta apenas a parte com falta, mantendo o restante em operação."],"a":3,"e":""},{"t":0,"s":"No parágrafo 3, o termo *dependability* refere-se:","o":["à capacidade de atuar quando necessário.","à velocidade dos disjuntores.","à capacidade de não atuar indevidamente.","ao custo do sistema."],"a":0,"e":""},{"t":0,"s":"Segundo o texto, *security* é:","o":["a proteção contra ataques cibernéticos.","a segurança dos operadores.","a capacidade de evitar atuar quando não deve.","a capacidade de atuar sempre."],"a":2,"e":""},{"t":0,"s":"A expressão *conflict with each other* (parágrafo 4) indica que os dois aspectos:","o":["se complementam perfeitamente.","entram em conflito entre si.","não têm relação.","são idênticos."],"a":1,"e":""},{"t":0,"s":"Segundo o parágrafo 4, um relé extremamente sensível:","o":["nunca atua desnecessariamente.","raramente deixa de detectar faltas, mas pode atuar desnecessariamente.","não detecta faltas.","dispensa ajustes."],"a":1,"e":""},{"t":0,"s":"A corrente de energização de um transformador (*inrush current*) é citada como exemplo de:","o":["tipo de curto-circuito.","perturbação normal que pode causar atuação indevida.","função do disjuntor.","falha de isolamento."],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, os relés de distância calculam:","o":["a impedância aparente, razão entre tensão e corrente medidas.","apenas a corrente.","a potência ativa.","a frequência da rede."],"a":0,"e":""},{"t":1,"s":"A expressão *Rather than* (parágrafo 1) significa:","o":["Por causa de","Em vez de","Assim como","Além de"],"a":1,"e":""},{"t":1,"s":"De acordo com o Texto 2, a impedância aparente indica a distância da falta porque:","o":["a impedância de uma linha é aproximadamente proporcional ao seu comprimento.","a tensão é constante ao longo da linha.","os relés medem o tempo de propagação.","a corrente aumenta com a distância."],"a":0,"e":""},{"t":1,"s":"Segundo o parágrafo 2, a zona 1 normalmente cobre:","o":["apenas a linha adjacente.","100% da linha com atraso.","toda a linha mais parte da adjacente.","de 80% a 85% da linha, sem atraso intencional."],"a":3,"e":""},{"t":1,"s":"De acordo com o Texto 2, a parte restante da linha não é incluída na zona 1:","o":["porque nunca ocorrem faltas nela.","porque é protegida por fusíveis.","para evitar atuação em faltas na linha seguinte, considerando erros de medição e de parâmetros.","para reduzir o custo do relé."],"a":2,"e":""},{"t":1,"s":"No parágrafo 2, *given* em 'given the errors in measurements' tem sentido de:","o":["após","apesar de","considerando","exceto"],"a":2,"e":""},{"t":1,"s":"Segundo o parágrafo 3, a resistência de falta pode:","o":["eliminar a falta.","fazer a falta parecer mais próxima.","reduzir a impedância medida.","fazer a falta parecer mais distante do que realmente está."],"a":3,"e":""},{"t":1,"s":"De acordo com o Texto 2, as oscilações de potência (*power swings*):","o":["podem levar a impedância aparente às zonas de atuação mesmo sem falta.","sempre indicam faltas reais.","não afetam os relés de distância.","ocorrem apenas em linhas curtas."],"a":0,"e":""},{"t":1,"s":"Segundo o parágrafo 4, os esquemas de teleproteção:","o":["dispensam relés nas extremidades.","substituem os disjuntores.","permitem eliminar a falta em toda a linha em alta velocidade.","aumentam o tempo de atuação."],"a":2,"e":""},{"t":1,"s":"No parágrafo 4, *To overcome these limitations* significa:","o":["Devido a essas limitações","Apesar dessas limitações","Para superar essas limitações","Além dessas limitações"],"a":2,"e":""}],"w":["Em inglês, explique por que a seletividade e a confiabilidade são requisitos importantes de um sistema de proteção.","Em inglês, descreva o princípio de funcionamento de um relé de distância e uma situação que pode comprometer sua precisão."]},{"t":"Transmissão em corrente contínua (HVDC)","en":"HVDC transmission","x":[{"h":"Why Direct Current Is Back","p":["At the end of the nineteenth century, the so-called war of the currents ended with the victory of alternating current (AC). Transformers made it easy to raise and lower AC voltages, which allowed electricity to be transmitted efficiently over long distances. Direct current (DC), in contrast, could not be transformed economically at the time.","More than a century later, high-voltage direct current (HVDC) transmission has become an essential technology. Its main advantage appears in long-distance bulk transmission. Although HVDC requires expensive converter stations at both ends, DC lines need fewer conductors, narrower corridors and experience lower losses. Beyond a certain distance, typically 600 to 800 km for overhead lines, the total cost of HVDC becomes lower than that of AC.","Brazil offers a remarkable example. The Belo Monte transmission system carries power from the Amazon region to the Southeast over more than 2,000 km using ±800 kV lines, one of the longest HVDC links in the world.","HVDC is also the preferred solution for submarine cables, since AC cables generate large capacitive currents that limit their length. In addition, HVDC can connect grids operating at different frequencies or that are not synchronized, as in the link between the 50 Hz and 60 Hz systems of Paraguay and Brazil."]},{"h":"Line-Commutated and Voltage-Source Converters","p":["Two converter technologies dominate HVDC applications. Line-commutated converters (LCC) use thyristors, which can be turned on by a gate pulse but turn off only when their current falls to zero. These converters have been used since the 1970s and can handle very high power levels with low losses.","However, LCCs depend on a strong AC network to perform commutation and consume a significant amount of reactive power, which must be supplied by filters and capacitor banks. Moreover, reversing the direction of power flow requires reversing the voltage polarity, which makes them unsuitable for multi-terminal grids.","Voltage-source converters (VSC), on the other hand, use transistors such as IGBTs, which can be switched on and off at will. Modern VSCs adopt the modular multilevel converter (MMC) topology, in which hundreds of submodules generate an almost sinusoidal voltage. As a result, large harmonic filters are no longer required.","Because VSCs can control active and reactive power independently and can even energize a network without existing generation, they are well suited to connecting offshore wind farms. Their main disadvantage is higher losses than LCCs, although this gap has narrowed considerably."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, a corrente alternada venceu a 'guerra das correntes' porque:","o":["a corrente contínua era mais barata.","não existiam linhas longas.","a corrente contínua não podia ser gerada.","os transformadores facilitavam elevar e reduzir sua tensão."],"a":3,"e":""},{"t":0,"s":"A expressão *the so-called war of the currents* (parágrafo 1) significa:","o":["a chamada guerra das correntes.","a guerra mais recente.","a suposta guerra mundial.","a guerra que nunca aconteceu."],"a":0,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, uma desvantagem do HVDC é:","o":["os corredores mais largos.","as perdas mais elevadas.","o maior número de condutores.","a necessidade de estações conversoras caras nas duas extremidades."],"a":3,"e":""},{"t":0,"s":"Segundo o Texto 1, as linhas CC, em comparação com as CA:","o":["precisam de mais condutores.","precisam de menos condutores, corredores mais estreitos e têm menores perdas.","têm maiores perdas.","exigem corredores mais largos."],"a":1,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, o custo total do HVDC se torna menor que o do CA:","o":["em qualquer distância.","apenas em cabos submarinos.","abaixo de 100 km.","acima de certa distância, tipicamente 600 a 800 km para linhas aéreas."],"a":3,"e":""},{"t":0,"s":"A palavra *Beyond* em 'Beyond a certain distance' significa:","o":["Abaixo de","Antes de","Além de","Perto de"],"a":2,"e":""},{"t":0,"s":"Segundo o parágrafo 3, o sistema de Belo Monte:","o":["conecta o Brasil ao Paraguai.","usa corrente alternada em 800 kV.","é um cabo submarino.","transporta energia da Amazônia ao Sudeste por mais de 2.000 km."],"a":3,"e":""},{"t":0,"s":"De acordo com o parágrafo 4, o HVDC é preferido em cabos submarinos porque:","o":["cabos CC são mais flexíveis.","cabos CA geram grandes correntes capacitivas que limitam seu comprimento.","a água do mar conduz corrente contínua.","cabos CA não podem ser fabricados."],"a":1,"e":""},{"t":0,"s":"Segundo o Texto 1, o elo entre Paraguai e Brasil exemplifica:","o":["um cabo submarino.","a vitória da corrente alternada.","a conexão entre sistemas de frequências diferentes.","uma linha CA de longa distância."],"a":2,"e":""},{"t":0,"s":"No parágrafo 4, *since* em 'since AC cables generate' expressa:","o":["causa.","concessão.","tempo.","condição."],"a":0,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, os tiristores:","o":["podem ser ligados e desligados à vontade.","podem ser ligados por um pulso de gate, mas só desligam quando a corrente cai a zero.","são usados em conversores VSC.","foram criados na década de 2010."],"a":1,"e":""},{"t":1,"s":"De acordo com o Texto 2, os conversores LCC são usados desde:","o":["os anos 2000.","2020.","o século XIX.","a década de 1970."],"a":3,"e":""},{"t":1,"s":"Segundo o parágrafo 2, os LCCs:","o":["são ideais para redes multiterminais.","podem energizar uma rede sem geração.","dependem de uma rede CA forte e consomem muita potência reativa.","não consomem potência reativa."],"a":2,"e":""},{"t":1,"s":"De acordo com o Texto 2, inverter o sentido do fluxo de potência em um LCC exige:","o":["desligar a rede CA.","trocar os tiristores por IGBTs.","inverter a polaridade da tensão.","aumentar a frequência."],"a":2,"e":""},{"t":1,"s":"A palavra *unsuitable* (parágrafo 2) significa:","o":["inadequados","indispensáveis","eficientes","seguros"],"a":0,"e":""},{"t":1,"s":"Segundo o parágrafo 3, os conversores VSC usam:","o":["transformadores sem semicondutores.","transistores, como IGBTs, que podem ser ligados e desligados à vontade.","apenas tiristores.","bancos de capacitores como chaves."],"a":1,"e":""},{"t":1,"s":"A expressão *at will* (parágrafo 3) significa:","o":["automaticamente, sem controle.","com dificuldade.","à vontade, quando se deseja.","apenas uma vez."],"a":2,"e":""},{"t":1,"s":"De acordo com o Texto 2, a topologia MMC dispensa grandes filtros harmônicos porque:","o":["centenas de submódulos geram uma tensão quase senoidal.","usa tiristores.","consome muita potência reativa.","opera em baixa tensão."],"a":0,"e":""},{"t":1,"s":"Segundo o parágrafo 4, os VSCs são adequados para conectar parques eólicos offshore porque:","o":["controlam potências ativa e reativa independentemente e podem energizar redes sem geração.","têm perdas menores que os LCCs.","dependem de uma rede CA forte.","não precisam de conversores."],"a":0,"e":""},{"t":1,"s":"De acordo com o parágrafo 4, em relação às perdas dos VSCs:","o":["são idênticas às dos LCCs.","são maiores que as dos LCCs, mas a diferença diminuiu consideravelmente.","são menores que as dos LCCs.","aumentaram nos últimos anos."],"a":1,"e":""}],"w":["Em inglês, explique em quais situações a transmissão em corrente contínua (HVDC) é mais vantajosa que a transmissão em corrente alternada.","Em inglês, compare os conversores LCC e VSC, mencionando uma vantagem e uma desvantagem de cada tecnologia."]},{"t":"Máquinas elétricas e acionamentos","en":"Electric motors and variable-speed drives","x":[{"h":"Motors: The Largest Electrical Load","p":["Electric motors are everywhere: they drive pumps, fans, compressors, conveyors, elevators and countless household appliances. It is estimated that motor-driven systems account for roughly 45% of global electricity consumption, which makes them the largest single category of electrical load.","The three-phase induction motor is by far the most common type in industry. Its popularity results from its simple and robust construction: in the squirrel-cage version, the rotor consists of conducting bars short-circuited by end rings, with no brushes or slip rings. As a result, maintenance requirements are minimal.","The operation of the induction motor relies on a rotating magnetic field produced by the stator windings. This field induces currents in the rotor bars, and the interaction between these currents and the field produces torque. For torque to be produced, the rotor must turn slightly slower than the field; the relative difference between the two speeds is called slip.","Because even small improvements in efficiency translate into large energy savings, many countries, including Brazil, have established minimum efficiency standards for motors. Nevertheless, the greatest savings often do not come from the motor itself but from the way it is controlled."]},{"h":"Variable-Speed Drives","p":["In many installations, pumps and fans operate at full speed, and the flow is regulated by throttling valves or dampers. This method is simple but highly wasteful, since the motor consumes almost full power while part of the energy is dissipated in the valve.","A variable-speed drive (VSD), also known as a frequency inverter, adjusts the frequency and voltage supplied to the motor, thus changing its speed. In centrifugal pumps and fans, the power required is approximately proportional to the cube of the speed. Therefore, reducing the speed by just 20% can cut power consumption by nearly half.","Besides saving energy, VSDs offer soft starting, which limits inrush currents and reduces mechanical stress on belts and couplings. They also allow precise control of speed and torque, which is essential in applications such as elevators and machine tools.","VSDs, however, have side effects that must be considered. The fast switching of their transistors produces voltage harmonics and high-frequency common-mode voltages, which can damage motor bearings through circulating currents. Long cables between the drive and the motor may also cause voltage reflections that stress the winding insulation. Output filters and properly designed cabling help to mitigate these problems."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, os sistemas acionados por motores respondem por:","o":["cerca de 4,5% do consumo global.","quase todo o consumo residencial.","cerca de 45% do consumo global de eletricidade.","menos de 10% do consumo industrial."],"a":2,"e":""},{"t":0,"s":"No parágrafo 1, *which makes them the largest single category*, o pronome *them* refere-se:","o":["aos eletrodomésticos.","aos elevadores.","aos sistemas acionados por motores.","às bombas."],"a":2,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, a popularidade do motor de indução trifásico resulta:","o":["de sua construção simples e robusta.","do uso de escovas e anéis coletores.","da necessidade de manutenção frequente.","de seu baixo rendimento."],"a":0,"e":""},{"t":0,"s":"Segundo o Texto 1, no motor de gaiola de esquilo, o rotor:","o":["é feito de ímãs permanentes.","é alimentado diretamente pela rede.","é formado por barras condutoras curto-circuitadas por anéis, sem escovas.","possui escovas e anéis coletores."],"a":2,"e":""},{"t":0,"s":"A expressão *As a result* (parágrafo 2) introduz:","o":["a consequência de manutenção mínima.","uma desvantagem do motor.","um exemplo de aplicação.","uma comparação com motores CC."],"a":0,"e":""},{"t":0,"s":"De acordo com o parágrafo 3, para que haja produção de torque:","o":["o rotor deve girar ligeiramente mais devagar que o campo.","o escorregamento deve ser zero.","o rotor deve estar parado.","o rotor deve girar mais rápido que o campo."],"a":0,"e":""},{"t":0,"s":"Segundo o Texto 1, o escorregamento (*slip*) é:","o":["o torque máximo do motor.","a perda nos enrolamentos.","a corrente induzida no rotor.","a diferença relativa entre a velocidade do campo e a do rotor."],"a":3,"e":""},{"t":0,"s":"De acordo com o parágrafo 4, vários países estabeleceram padrões mínimos de eficiência porque:","o":["o Brasil exigiu isso de outros países.","os motores consomem pouca energia.","pequenas melhorias de eficiência se traduzem em grande economia de energia.","os motores são muito caros."],"a":2,"e":""},{"t":0,"s":"A palavra *Nevertheless* (parágrafo 4) introduz a ideia de que:","o":["os padrões de eficiência são inúteis.","a eficiência não importa.","os motores não podem ser controlados.","as maiores economias muitas vezes vêm do controle do motor, não do motor em si."],"a":3,"e":""},{"t":0,"s":"A palavra *roughly* (parágrafo 1) significa:","o":["rigorosamente","aproximadamente","no mínimo","raramente"],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, regular a vazão com válvulas de estrangulamento é:","o":["complexo e eficiente.","simples, mas muito desperdiçador.","proibido por norma.","a solução mais econômica."],"a":1,"e":""},{"t":1,"s":"A palavra *wasteful* (parágrafo 1) significa:","o":["que economiza","que desperdiça","que polui","que é seguro"],"a":1,"e":""},{"t":1,"s":"De acordo com o parágrafo 2, um inversor de frequência altera a velocidade do motor:","o":["ajustando a frequência e a tensão fornecidas.","fechando válvulas.","aumentando o escorregamento.","mudando o número de barras do rotor."],"a":0,"e":""},{"t":1,"s":"Segundo o Texto 2, em bombas centrífugas e ventiladores, reduzir a velocidade em 20% pode:","o":["não alterar o consumo.","dobrar o consumo.","reduzir o consumo em 20%.","reduzir o consumo de potência em quase metade."],"a":3,"e":"0,8³ ≈ 0,51."},{"t":1,"s":"A palavra *thus* (parágrafo 2) poderia ser traduzida por:","o":["apesar disso","entretanto","dessa forma","além disso"],"a":2,"e":""},{"t":1,"s":"De acordo com o parágrafo 3, a partida suave (*soft starting*):","o":["só é útil em elevadores.","limita as correntes de partida e reduz o estresse mecânico.","aumenta a corrente de partida.","elimina a necessidade de correias."],"a":1,"e":""},{"t":1,"s":"Segundo o Texto 2, o controle preciso de velocidade e torque é essencial em:","o":["cabos longos.","rolamentos.","válvulas e dampers.","elevadores e máquinas-ferramenta."],"a":3,"e":""},{"t":1,"s":"De acordo com o parágrafo 4, as tensões de modo comum de alta frequência podem:","o":["danificar os rolamentos do motor por meio de correntes circulantes.","reduzir os harmônicos.","aumentar a eficiência do motor.","melhorar o isolamento."],"a":0,"e":""},{"t":1,"s":"Segundo o Texto 2, cabos longos entre o inversor e o motor podem causar:","o":["eliminação dos harmônicos.","reflexões de tensão que estressam o isolamento dos enrolamentos.","redução das perdas.","partida suave."],"a":1,"e":""},{"t":1,"s":"A palavra *mitigate* (parágrafo 4) significa:","o":["medir","ignorar","agravar","atenuar"],"a":3,"e":""}],"w":["Em inglês, explique o princípio de funcionamento do motor de indução trifásico e por que ele é tão usado na indústria.","Em inglês, descreva os benefícios e os possíveis efeitos colaterais do uso de inversores de frequência no acionamento de motores."]},{"t":"Internet das Coisas","en":"IoT sensor networks and energy harvesting","x":[{"h":"Billions of Connected Things","p":["The Internet of Things (IoT) refers to the network of physical objects equipped with sensors, processors and communication interfaces that allow them to collect and exchange data. Applications range from smart homes and precision agriculture to industrial monitoring and environmental protection.","Most IoT devices share a set of severe constraints. They must be small and cheap, and they are often installed in places where replacing batteries is difficult or impossible, such as inside walls, on bridges or in remote fields. As a consequence, energy efficiency is usually the most important design criterion.","To meet these requirements, low-power wide-area networks (LPWAN), such as LoRaWAN and NB-IoT, were developed. They trade data rate for range and energy efficiency: a sensor may transmit only a few bytes per hour, but it can reach a gateway several kilometers away and operate for years on a single battery.","Security, however, remains a serious concern. Many devices are deployed with default passwords and are rarely updated, which makes them easy targets for attackers. In several well-known incidents, hundreds of thousands of compromised cameras and routers were used to launch large-scale attacks on internet services."]},{"h":"Harvesting Energy from the Environment","p":["An attractive alternative to batteries is energy harvesting, that is, collecting small amounts of energy from the environment. Possible sources include light, temperature differences, vibrations and radio-frequency signals.","Each source has its own characteristics. Indoor photovoltaic cells can provide tens of microwatts per square centimeter under artificial lighting, which is enough for many low-duty-cycle sensors. Thermoelectric generators convert temperature gradients into electricity and are useful on industrial pipes or on the human body. Piezoelectric materials, in turn, produce charge when mechanically deformed and can exploit the vibrations of machines.","Since the harvested power is small and intermittent, the system must store energy in a capacitor or a small rechargeable battery and manage it carefully. Dedicated power management circuits extract energy from the harvester at its optimal operating point and convert it to the voltage required by the electronics.","The software must also be energy-aware. Instead of following a fixed schedule, an energy-neutral device adapts its sensing and transmission rate to the energy available, so that it never consumes more than it harvests over time. This approach may eventually allow sensors to operate indefinitely without maintenance."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, a Internet das Coisas refere-se a:","o":["um novo tipo de navegador de internet.","computadores pessoais de alto desempenho.","uma rede de objetos físicos com sensores, processadores e interfaces de comunicação.","redes sociais para engenheiros."],"a":2,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, a eficiência energética costuma ser o critério de projeto mais importante porque:","o":["os dispositivos ficam sempre conectados à rede elétrica.","muitos dispositivos ficam em locais onde trocar baterias é difícil ou impossível.","as baterias são ilimitadas.","os dispositivos são grandes e caros."],"a":1,"e":""},{"t":0,"s":"A palavra *severe* em 'severe constraints' (parágrafo 2) significa:","o":["rigorosas","leves","antigas","opcionais"],"a":0,"e":""},{"t":0,"s":"Segundo o parágrafo 3, as redes LPWAN, como LoRaWAN e NB-IoT:","o":["exigem trocas frequentes de bateria.","oferecem altas taxas de dados com curto alcance.","não podem alcançar gateways distantes.","sacrificam a taxa de dados em favor de alcance e eficiência energética."],"a":3,"e":""},{"t":0,"s":"A expressão *trade data rate for range* significa:","o":["comercializar sensores.","vender dados para aumentar o alcance.","abrir mão de taxa de dados em troca de alcance.","aumentar a taxa de dados e o alcance."],"a":2,"e":""},{"t":0,"s":"De acordo com o Texto 1, um sensor LPWAN pode:","o":["transmitir poucos bytes por hora e operar por anos com uma bateria.","alcançar apenas alguns metros.","transmitir vídeos em alta resolução.","operar sem nenhuma fonte de energia."],"a":0,"e":""},{"t":0,"s":"Segundo o parágrafo 4, muitos dispositivos são alvos fáceis porque:","o":["usam criptografia avançada.","são instalados com senhas padrão e raramente atualizados.","não possuem processadores.","ficam desligados."],"a":1,"e":""},{"t":0,"s":"No parágrafo 4, *which makes them easy targets*, o pronome *them* refere-se:","o":["aos serviços de internet.","aos dispositivos.","aos atacantes.","às senhas."],"a":1,"e":""},{"t":0,"s":"De acordo com o texto, câmeras e roteadores comprometidos foram usados para:","o":["monitorar o meio ambiente.","proteger redes domésticas.","atualizar senhas automaticamente.","lançar ataques em larga escala a serviços de internet."],"a":3,"e":""},{"t":0,"s":"A palavra *However* (parágrafo 4) indica que a segurança:","o":["continua sendo um problema, apesar dos avanços descritos.","não é relevante.","é a principal vantagem da IoT.","foi totalmente resolvida."],"a":0,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, *energy harvesting* consiste em:","o":["comprar energia de concessionárias.","coletar pequenas quantidades de energia do ambiente.","eliminar o consumo dos sensores.","armazenar grandes quantidades de energia."],"a":1,"e":""},{"t":1,"s":"Assinale a alternativa que NÃO aparece no Texto 2 como fonte de energia para coleta:","o":["energia nuclear.","vibrações.","diferenças de temperatura.","luz."],"a":0,"e":""},{"t":1,"s":"De acordo com o parágrafo 2, células fotovoltaicas em ambientes internos:","o":["fornecem quilowatts.","só funcionam ao ar livre.","não funcionam com luz artificial.","podem fornecer dezenas de microwatts por centímetro quadrado sob luz artificial."],"a":3,"e":""},{"t":1,"s":"Segundo o Texto 2, os geradores termoelétricos:","o":["dependem de luz solar.","captam sinais de rádio.","produzem carga quando deformados.","convertem gradientes de temperatura em eletricidade."],"a":3,"e":""},{"t":1,"s":"No parágrafo 2, *in turn* é usado para:","o":["expressar uma condição.","indicar oposição.","introduzir o próximo item da enumeração.","encerrar o texto."],"a":2,"e":""},{"t":1,"s":"De acordo com o parágrafo 3, a energia coletada precisa ser armazenada porque:","o":["a potência coletada é muito alta.","os sensores não consomem energia.","os capacitores são obrigatórios por lei.","a potência coletada é pequena e intermitente."],"a":3,"e":""},{"t":1,"s":"Segundo o Texto 2, os circuitos de gerenciamento de energia:","o":["aumentam o consumo dos dispositivos.","impedem o armazenamento de energia.","extraem energia do coletor em seu ponto ótimo e a convertem para a tensão necessária.","substituem os sensores."],"a":2,"e":""},{"t":1,"s":"De acordo com o parágrafo 4, um dispositivo energeticamente neutro:","o":["consome mais do que coleta.","adapta sua taxa de medição e transmissão à energia disponível.","segue sempre um cronograma fixo.","depende de baterias substituíveis."],"a":1,"e":""},{"t":1,"s":"A expressão *so that* (parágrafo 4) indica:","o":["finalidade.","contraste.","causa.","comparação."],"a":0,"e":""},{"t":1,"s":"Segundo o parágrafo 4, essa abordagem poderá permitir que os sensores:","o":["consumam mais energia.","dispensem software.","operem indefinidamente sem manutenção.","sejam desligados com mais frequência."],"a":2,"e":""}],"w":["Em inglês, descreva as principais restrições de projeto de dispositivos IoT e explique por que a eficiência energética é tão importante.","Em inglês, explique o que é energy harvesting e dê dois exemplos de fontes de energia que podem ser aproveitadas."]},{"t":"Comunicações ópticas","en":"Optical fiber communications","x":[{"h":"Light as an Information Carrier","p":["Optical fibers form the backbone of the modern internet. Almost all intercontinental data traffic travels through submarine fiber cables, and fibers increasingly reach homes and mobile base stations. Their success is explained by two remarkable properties: extremely low attenuation and enormous bandwidth.","An optical fiber consists of a core surrounded by a cladding with a slightly lower refractive index. Light launched into the core at an appropriate angle is confined by total internal reflection and can travel long distances. In standard single-mode fibers operating at 1550 nm, the attenuation is about 0.2 dB/km, which means that the signal loses only half of its power after 15 km.","Even so, attenuation accumulates over thousands of kilometers. In the past, signals had to be converted to the electrical domain, regenerated and converted back to light at regular intervals. The invention of the erbium-doped fiber amplifier (EDFA) in the late 1980s changed this situation, since it amplifies many optical channels simultaneously without electrical conversion.","This capability made wavelength-division multiplexing (WDM) practical. In WDM systems, dozens of channels, each at a different wavelength, share the same fiber, multiplying its capacity. Today, a single fiber can carry tens of terabits per second."]},{"h":"Dispersion and Coherent Detection","p":["Besides attenuation, the main impairment in optical links is dispersion. Because different spectral components of a pulse travel at slightly different speeds, the pulse spreads out as it propagates. If the spreading is excessive, neighboring pulses overlap, and the receiver can no longer distinguish them.","For many years, dispersion was compensated optically, using special fibers with opposite dispersion characteristics inserted along the link. This solution worked, but it added losses and required careful planning for each route.","The introduction of coherent detection around 2010 transformed long-haul systems. A coherent receiver mixes the incoming signal with a local laser and recovers both the amplitude and the phase of the optical field. Once these quantities are available in digital form, dispersion can be compensated by digital signal processing, eliminating the need for compensating fibers.","Coherent detection also allows the use of advanced modulation formats, such as quadrature amplitude modulation, which transmit several bits per symbol. Nevertheless, higher-order formats require a higher signal-to-noise ratio and are more sensitive to nonlinear effects. Choosing the modulation format therefore involves a compromise between capacity and reach."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, o sucesso das fibras ópticas se explica por:","o":["baixo custo de instalação e flexibilidade.","imunidade total a qualquer perda.","atenuação extremamente baixa e enorme largura de banda.","alta atenuação e pequena largura de banda."],"a":2,"e":""},{"t":0,"s":"A palavra *backbone* (parágrafo 1), no contexto, significa:","o":["uma parte secundária.","uma estação base.","a infraestrutura principal.","um tipo de cabo elétrico."],"a":2,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, a luz é confinada no núcleo da fibra:","o":["por amplificação óptica.","por reflexão interna total.","pelo laser local.","pela conversão elétrica."],"a":1,"e":""},{"t":0,"s":"Segundo o Texto 1, a casca (*cladding*) tem:","o":["função de amplificar o sinal.","a mesma composição do núcleo.","índice de refração maior que o do núcleo.","índice de refração ligeiramente menor que o do núcleo."],"a":3,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, com atenuação de 0,2 dB/km, o sinal:","o":["perde metade da potência após 15 km.","perde metade da potência após 1 km.","não perde potência.","perde toda a potência após 15 km."],"a":0,"e":""},{"t":0,"s":"A expressão *Even so* (parágrafo 3) significa:","o":["Mesmo assim","Além disso","Por isso","Por exemplo"],"a":0,"e":""},{"t":0,"s":"Segundo o parágrafo 3, antes do EDFA, os sinais precisavam:","o":["usar multiplexação por comprimento de onda.","ser detectados coerentemente.","ser transmitidos sem amplificação por milhares de quilômetros.","ser convertidos para o domínio elétrico, regenerados e reconvertidos em luz."],"a":3,"e":""},{"t":0,"s":"De acordo com o Texto 1, o EDFA mudou a situação porque:","o":["reduz o número de canais.","elimina a atenuação da fibra.","amplifica muitos canais ópticos simultaneamente sem conversão elétrica.","converte luz em eletricidade."],"a":2,"e":""},{"t":0,"s":"No parágrafo 4, *This capability* refere-se:","o":["à atenuação da fibra.","à capacidade do EDFA de amplificar vários canais ao mesmo tempo.","à reflexão interna total.","à regeneração elétrica."],"a":1,"e":""},{"t":0,"s":"Segundo o parágrafo 4, nos sistemas WDM:","o":["dezenas de canais, cada um em um comprimento de onda, compartilham a mesma fibra.","os canais usam o mesmo comprimento de onda.","cada fibra transporta apenas um canal.","a capacidade da fibra diminui."],"a":0,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, a dispersão faz com que:","o":["o pulso se alargue ao se propagar.","o pulso se estreite.","a fibra se aqueça.","o sinal seja amplificado."],"a":0,"e":""},{"t":1,"s":"De acordo com o Texto 2, quando o alargamento é excessivo:","o":["a fibra se rompe.","a atenuação desaparece.","o receptor recupera melhor o sinal.","pulsos vizinhos se sobrepõem e o receptor não consegue distingui-los."],"a":3,"e":""},{"t":1,"s":"No parágrafo 1, *Besides* pode ser traduzido por:","o":["Apesar de","Além de","Em vez de","Antes de"],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 2, a compensação óptica da dispersão:","o":["era perfeita e sem custos.","nunca foi utilizada.","eliminava a atenuação.","funcionava, mas acrescentava perdas e exigia planejamento cuidadoso."],"a":3,"e":""},{"t":1,"s":"De acordo com o parágrafo 3, a detecção coerente foi introduzida por volta de:","o":["1990","2010","2020","1980"],"a":1,"e":""},{"t":1,"s":"Segundo o Texto 2, um receptor coerente:","o":["usa fibras compensadoras.","dispensa processamento digital.","mistura o sinal recebido com um laser local e recupera amplitude e fase.","recupera apenas a amplitude do sinal."],"a":2,"e":""},{"t":1,"s":"De acordo com o parágrafo 3, com amplitude e fase disponíveis em forma digital:","o":["a dispersão pode ser compensada por processamento digital de sinais.","não é possível corrigir a dispersão.","a dispersão aumenta.","as fibras compensadoras tornam-se obrigatórias."],"a":0,"e":""},{"t":1,"s":"No parágrafo 3, *Once* em 'Once these quantities are available' significa:","o":["Uma única vez","Uma vez que / assim que","Apesar de","Antigamente"],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 4, os formatos de modulação de ordem mais alta:","o":["não são afetados por efeitos não lineares.","exigem menor relação sinal-ruído.","exigem maior relação sinal-ruído e são mais sensíveis a efeitos não lineares.","transmitem menos bits por símbolo."],"a":2,"e":""},{"t":1,"s":"De acordo com a conclusão do Texto 2, escolher o formato de modulação envolve:","o":["apenas a escolha do menor custo.","a eliminação da dispersão.","o uso de fibras compensadoras.","um compromisso entre capacidade e alcance."],"a":3,"e":""}],"w":["Em inglês, explique por que o amplificador a fibra dopada com érbio (EDFA) foi tão importante para as comunicações ópticas.","Em inglês, descreva o problema da dispersão em fibras ópticas e como a detecção coerente ajudou a resolvê-lo."]},{"t":"Microrredes","en":"Microgrids and islanded operation","x":[{"h":"Small Grids with Big Ambitions","p":["A microgrid is a group of interconnected loads and distributed energy resources within clearly defined electrical boundaries that acts as a single controllable entity with respect to the main grid. It can operate connected to the utility network or disconnect and function autonomously, a mode known as islanded operation.","The ability to island is the main feature that distinguishes microgrids from ordinary distribution networks with distributed generation. During a blackout of the main grid, a microgrid can keep supplying critical loads, such as hospitals, data centers or military bases. For this reason, resilience is frequently the primary motivation for building one.","Microgrids also play an important role in remote areas. Many isolated communities, including some in the Brazilian Amazon, still depend on diesel generators, which are expensive to operate and highly polluting. Combining solar panels, batteries and a smaller diesel unit can significantly reduce fuel consumption while maintaining a reliable supply.","Nevertheless, designing a microgrid is a complex task. Engineers must size each component so as to minimize total costs while guaranteeing that demand will be met under unfavorable conditions, such as several consecutive cloudy days. Optimization tools are commonly used to evaluate thousands of possible configurations."]},{"h":"Controlling an Islanded Microgrid","p":["When connected to the main grid, a microgrid can rely on it to set the voltage and frequency. In islanded mode, however, this responsibility falls on the local sources. Since most of these sources are connected through power electronic inverters, which have no inherent inertia, keeping the system stable is a considerable challenge.","A widely used solution is droop control. Inspired by the behavior of synchronous generators, each inverter slightly reduces its frequency as its active power output increases. In this way, several inverters can share the load in proportion to their ratings without needing a communication link between them.","Droop control, however, causes the frequency and voltage to deviate from their nominal values. To correct these deviations, a secondary control layer, which usually requires communication, periodically adjusts the setpoints of the inverters. A third, tertiary level may then optimize the economic dispatch of the resources.","Another critical moment is the transition between modes. When a fault in the main grid is detected, the microgrid must disconnect quickly and continue to operate without interruption. Reconnection, conversely, requires synchronizing the voltage, frequency and phase of the microgrid with those of the main grid before closing the switch."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, uma microrrede:","o":["é formada apenas por cargas.","age como uma única entidade controlável em relação à rede principal.","não pode se desconectar da rede principal.","é um gerador a diesel isolado."],"a":1,"e":""},{"t":0,"s":"De acordo com o Texto 1, a operação ilhada ocorre quando a microrrede:","o":["se desconecta e funciona de forma autônoma.","opera apenas com energia solar.","desliga todas as cargas.","se conecta à rede principal."],"a":0,"e":""},{"t":0,"s":"Segundo o parágrafo 2, o que distingue as microrredes das redes de distribuição comuns com geração distribuída é:","o":["a ausência de cargas críticas.","o uso de painéis solares.","a capacidade de ilhamento.","o menor custo."],"a":2,"e":""},{"t":0,"s":"Assinale a alternativa que NÃO é citada no parágrafo 2 como exemplo de carga crítica:","o":["data centers.","hospitais.","bases militares.","shopping centers."],"a":3,"e":""},{"t":0,"s":"No parágrafo 2, *For this reason* introduz:","o":["uma definição de microrrede.","um contraste com o parágrafo 1.","um exemplo de blackout.","a conclusão de que a resiliência é a principal motivação."],"a":3,"e":""},{"t":0,"s":"De acordo com o parágrafo 3, comunidades isoladas que dependem de geradores a diesel enfrentam:","o":["falta de demanda.","conexão instável com a rede principal.","excesso de energia renovável.","custos operacionais elevados e alta poluição."],"a":3,"e":""},{"t":0,"s":"Segundo o Texto 1, combinar painéis solares, baterias e um gerador a diesel menor pode:","o":["reduzir significativamente o consumo de combustível mantendo o fornecimento confiável.","aumentar o consumo de diesel.","tornar o fornecimento menos confiável.","eliminar a necessidade de baterias."],"a":0,"e":""},{"t":0,"s":"A expressão *so as to* (parágrafo 4) indica:","o":["oposição (embora).","tempo (enquanto).","finalidade (de modo a).","causa (porque)."],"a":2,"e":""},{"t":0,"s":"Segundo o parágrafo 4, o dimensionamento deve garantir o atendimento da demanda:","o":["mesmo em condições desfavoráveis, como vários dias nublados seguidos.","somente durante a noite.","apenas quando conectado à rede.","apenas em dias ensolarados."],"a":0,"e":""},{"t":0,"s":"De acordo com o parágrafo 4, as ferramentas de otimização são usadas para:","o":["medir a irradiância solar.","avaliar milhares de configurações possíveis.","controlar os inversores em tempo real.","substituir os engenheiros."],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, no modo ilhado, a responsabilidade de definir tensão e frequência:","o":["é eliminada.","recai sobre as fontes locais.","continua sendo da rede principal.","é dos consumidores."],"a":1,"e":""},{"t":1,"s":"De acordo com o Texto 2, manter o sistema estável é um desafio porque os inversores:","o":["não possuem inércia inerente.","não podem ser controlados.","possuem muita inércia.","são máquinas síncronas."],"a":0,"e":""},{"t":1,"s":"A expressão *falls on* (parágrafo 1) significa:","o":["cai de","recai sobre","desiste de","depende de"],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 2, no controle por *droop*, cada inversor:","o":["precisa de comunicação com os demais.","opera sempre na frequência nominal.","reduz ligeiramente sua frequência à medida que aumenta sua potência ativa.","aumenta a frequência quando a potência aumenta."],"a":2,"e":""},{"t":1,"s":"De acordo com o Texto 2, uma vantagem do controle por droop é que:","o":["dispensa o controle secundário.","não se inspira em geradores síncronos.","vários inversores compartilham a carga sem precisar de comunicação entre si.","elimina os desvios de frequência."],"a":2,"e":""},{"t":1,"s":"Segundo o parágrafo 3, o controle secundário tem como função:","o":["corrigir os desvios de frequência e tensão causados pelo droop.","otimizar o despacho econômico.","eliminar a comunicação.","desconectar a microrrede."],"a":0,"e":""},{"t":1,"s":"De acordo com o Texto 2, o nível terciário pode:","o":["sincronizar a fase com a rede principal.","corrigir desvios de tensão em milissegundos.","detectar faltas.","otimizar o despacho econômico dos recursos."],"a":3,"e":""},{"t":1,"s":"No parágrafo 3, *which usually requires communication* refere-se:","o":["ao controle por droop.","aos inversores.","à camada de controle secundário.","à frequência nominal."],"a":2,"e":""},{"t":1,"s":"Segundo o parágrafo 4, para reconectar a microrrede à rede principal é necessário:","o":["aguardar uma nova falta.","sincronizar tensão, frequência e fase antes de fechar a chave.","aumentar a frequência ao máximo.","desligar todas as cargas."],"a":1,"e":""},{"t":1,"s":"A palavra *conversely* (parágrafo 4) indica:","o":["uma adição simples.","um exemplo.","uma consequência.","uma relação inversa / contrastante."],"a":3,"e":""}],"w":["Em ing
