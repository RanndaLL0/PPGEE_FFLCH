<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulados 2610 Poli-Elétrica: proficiência em inglês</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF3; --ink:#14213D; --muted:#5A6479; --line:#D5DBE5;
  --pen:#2246C4; --pen-soft:#E3E9FB; --volt:#E9A800; --ok:#1C7A4E; --ok-soft:#DFF2E8; --bad:#B4372B; --bad-soft:#F8E3E0;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --barh:60px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0E1524; --surface:#161F33; --sunk:#1C2740; --ink:#E6EBF4; --muted:#9BA6BC; --line:#2B3754;
  --pen:#86A2FF; --pen-soft:#22305A; --volt:#F2BE2E; --ok:#55C792; --ok-soft:#173A2C; --bad:#F2796B; --bad-soft:#40211F;
}}
:root[data-theme="dark"]{
  --paper:#0E1524; --surface:#161F33; --sunk:#1C2740; --ink:#E6EBF4; --muted:#9BA6BC; --line:#2B3754;
  --pen:#86A2FF; --pen-soft:#22305A; --volt:#F2BE2E; --ok:#55C792; --ok-soft:#173A2C; --bad:#F2796B; --bad-soft:#40211F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);font-feature-settings:"tnum" 0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:4px}
img{max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.wide{max-width:1480px;margin:0 auto;padding:0 20px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1524}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1524}}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);background:var(--sunk)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* home */
.top{border-bottom:1px solid var(--line)}
.topin{display:flex;justify-content:space-between;align-items:center;height:56px;gap:12px}
.brand{font-weight:600}
.topin .muted{color:var(--muted);font-size:14px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:start;padding:56px 0 40px;border-bottom:1px solid var(--line)}
.code{font-weight:700;font-size:clamp(88px,15vw,184px);line-height:.8;letter-spacing:-.06em;color:var(--pen);font-feature-settings:"tnum" 1}
.code small{display:block;font-size:15px;letter-spacing:0;font-weight:500;color:var(--muted);margin-top:18px;line-height:1.3}
.hero h1{font:600 clamp(24px,3vw,34px)/1.18 var(--sans);letter-spacing:-.015em;margin:0 0 14px;max-width:24ch}
.hero .lead{color:var(--muted);margin:0 0 24px;max-width:60ch}
.facts{display:grid;grid-template-columns:repeat(4,auto);gap:8px 28px;margin:0;justify-content:start}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.notice{margin-top:22px;border-left:3px solid var(--volt);padding:6px 0 6px 14px;font-size:15px;max-width:62ch}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--pen-soft);border-radius:10px;padding:14px 18px;margin:28px 0 0}
.resume p{margin:0}
.modes{display:flex;gap:6px;margin:36px 0 8px;background:var(--sunk);padding:4px;border-radius:10px;width:max-content;max-width:100%}
.modes button{border:0;background:transparent;padding:9px 16px;border-radius:7px;font-weight:500;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.modedesc{color:var(--muted);margin:10px 0 6px;max-width:70ch}
.stats{font-size:15px;margin:0 0 20px}
.list{list-style:none;margin:0 0 64px;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto 68px;gap:16px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 8px}
.row:hover{background:var(--surface)}
.rn{font-weight:600;color:var(--muted);font-feature-settings:"tnum" 1}
.rt strong{display:block;font-weight:600}
.rt em{display:block;font-style:normal;color:var(--muted);font-size:14px}
.rscore{text-align:right;font-weight:600;font-feature-settings:"tnum" 1}
.rscore.none{color:var(--muted);font-weight:400;font-size:14px}
.strip{display:grid;grid-template-columns:repeat(10,9px);gap:4px}
.strip i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.strip i.y{background:var(--ok);border-color:var(--ok)}
.strip i.n{background:var(--bad);border-color:var(--bad)}
.wstat{font-size:13px;color:var(--muted);text-align:right;line-height:1.35}
.foot{color:var(--muted);font-size:14px;padding:0 0 48px;max-width:75ch}

/* intro */
.intro{padding:48px 0 64px;max-width:720px}
.intro h1{font:600 30px/1.2 var(--sans);margin:6px 0 4px;letter-spacing:-.01em}
.intro .sub{color:var(--muted);margin:0 0 28px}
.intro ol{padding-left:20px;margin:0 0 28px}
.intro li{margin:0 0 8px}
.check{display:flex;gap:10px;align-items:center;margin:0 0 28px}
.check input{width:18px;height:18px;accent-color:var(--pen)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* exam bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.barin{display:flex;align-items:center;gap:10px;height:var(--barh)}
.bt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.bt b{font-weight:600;font-size:15px}
.bt span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-weight:600;font-size:20px;font-feature-settings:"tnum" 1;padding:4px 10px;border-radius:6px}
.clock.warn{background:var(--volt);color:#14213D}
.prog{color:var(--muted);font-size:14px;font-feature-settings:"tnum" 1}
.paneswitch{display:none}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding-top:24px;padding-bottom:80px;align-items:start}
.split.sheeted{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) 150px}
.reader{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh) + 24px);max-height:calc(100dvh - var(--barh) - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tabs{position:sticky;top:0;display:flex;gap:4px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line);z-index:1}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--pen-soft);color:var(--pen)}
.text{padding:24px 28px 32px;font-family:var(--serif);font-size:18px;line-height:1.68}
.text h2{font:600 22px/1.3 var(--serif);margin:0 0 18px}
.text p{margin:0 0 16px;position:relative;padding-left:30px;max-width:68ch}
.pn{position:absolute;left:0;top:.28em;font:600 12px/1 var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 5px;font-feature-settings:"tnum" 1}
.dict{font:400 13px/1.4 var(--sans);color:var(--muted);margin-top:24px}

.group{font-size:14px;color:var(--muted);margin:8px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.group:not(:first-child){margin-top:32px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 14px}
.qh{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.qn{font-weight:700;color:var(--pen);font-feature-settings:"tnum" 1;min-width:22px}
.qs-text{margin:0;flex:1}
.tref{border:0;background:transparent;color:var(--muted);font-size:13px;padding:2px 6px;border-radius:4px;text-decoration:underline;text-underline-offset:3px}
.tref:hover{color:var(--pen)}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:8px 8px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--sunk)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.bub{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);transition:background .12s,border-color .12s}
.opt input:checked + .bub{background:var(--pen);border-color:var(--pen);color:#fff}
.opt input:focus-visible + .bub{outline:2px solid var(--pen);outline-offset:2px}
.opt .ot{padding-top:2px}
.opt:has(input:checked){background:var(--pen-soft)}
em{font-style:italic}

.sheet{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh) + 24px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;max-height:calc(100dvh - var(--barh) - 48px - env(safe-area-inset-top,0px));overflow:auto}
.sheet h3{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--muted)}
.srow{display:grid;grid-template-columns:22px repeat(4,22px);gap:3px;align-items:center;margin:0 0 3px}
.srow a{font-size:12px;color:var(--muted);text-decoration:none;font-feature-settings:"tnum" 1;text-align:right;padding-right:4px}
.srow button{width:22px;height:22px;border-radius:50%;border:1.2px solid var(--line);background:transparent;font-size:10px;font-weight:600;color:var(--muted);padding:0}
.srow button.on{background:var(--pen);border-color:var(--pen);color:#fff}
.srow button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.srow button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.srow button.miss{border-color:var(--ok);color:var(--ok)}

/* result */
.summary{display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:center;padding:32px 0 24px;border-bottom:1px solid var(--line)}
.big{font-weight:700;font-size:72px;line-height:.9;letter-spacing:-.04em;font-feature-settings:"tnum" 1}
.big small{font-size:24px;color:var(--muted);letter-spacing:0;font-weight:500}
.sumtext p{margin:0 0 4px}
.sumtext .muted{color:var(--muted);font-size:15px}
.rv .opt{cursor:default}
.rv .opt:hover{background:transparent}
.rv .opt.ok{background:var(--ok-soft)}
.rv .opt.ok .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.rv .opt.bad{background:var(--bad-soft)}
.rv .opt.bad .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.tag{font-size:12px;font-weight:600;margin-left:8px}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.why{margin:10px 0 0;padding:10px 12px;background:var(--sunk);border-radius:8px;font-size:15px}
.qmark{font-size:13px;font-weight:600}
.qmark.ok{color:var(--ok)}.qmark.bad{color:var(--bad)}
.filter{display:flex;gap:10px;align-items:center;margin:0 0 14px;font-size:15px}
.filter input{accent-color:var(--pen);width:17px;height:17px}

/* writing */
.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 18px}
.task h3{margin:0 0 6px;font-size:16px}
.prompt{margin:0 0 12px}
textarea{width:100%;min-height:240px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--serif)}
textarea:focus{outline:2px solid var(--pen);outline-offset:-1px;border-color:transparent}
.wc{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:14px;color:var(--muted)}
.wc b{font-feature-settings:"tnum" 1;color:var(--ink);font-size:16px}
.wc.good b{color:var(--ok)} .wc.over b{color:var(--bad)}
.meter{flex:1;height:8px;background:var(--sunk);border-radius:4px;position:relative;overflow:hidden;max-width:220px}
.meter::before{content:"";position:absolute;left:71.4%;width:14.3%;top:0;bottom:0;background:var(--ok-soft);border-left:1px solid var(--ok);border-right:1px solid var(--ok)}
.meter i{position:absolute;left:0;top:2px;bottom:2px;background:var(--pen);border-radius:3px;max-width:100%}
.wc.good .meter i{background:var(--ok)} .wc.over .meter i{background:var(--bad)}
.note{font-size:14px;color:var(--muted);margin:0 0 16px}
.checklist{list-style:none;padding:0;margin:0 0 8px}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.checklist input{margin-top:4px;width:17px;height:17px;accent-color:var(--pen);flex:none}
.final{white-space:pre-wrap;font:400 17px/1.6 var(--serif);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 12px}
.phrases{columns:2;column-gap:28px;font-size:15px;padding-left:18px}
.phrases li{break-inside:avoid;margin-bottom:4px}

/* pause + modal */
.pauseveil{position:fixed;inset:0;background:var(--paper);z-index:30;display:grid;place-items:center;text-align:center;padding:24px}
.pauseveil h2{margin:0 0 6px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,30,.5);display:grid;place-items:center;padding:20px}
.mbox{background:var(--surface);border-radius:14px;padding:24px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mbox h2{margin:0 0 8px;font-size:20px}
.mbox p{margin:0 0 20px;color:var(--muted)}
.mbox .actions{justify-content:flex-end}

@media (max-width:1240px){ .split.sheeted{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)} .sheet{display:none} }
@media (max-width:980px){
  .split,.split.sheeted{grid-template-columns:1fr;padding-top:12px}
  .reader{position:static;max-height:none;overflow:visible}
  .tabs{top:calc(env(safe-area-inset-top,0px) + var(--barh) + 48px);position:sticky;border-radius:12px 12px 0 0}
  .paneswitch{display:flex;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh));z-index:15;background:var(--paper);padding:6px 20px;gap:6px;border-bottom:1px solid var(--line)}
  .paneswitch button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px;font-weight:500;color:var(--muted)}
  .paneswitch button[aria-selected="true"]{background:var(--pen);border-color:var(--pen);color:#fff}
  .split[data-pane="t"] .main{display:none}
  .split[data-pane="q"] .reader{display:none}
  .prog,.hide-sm{display:none}
}
@media (max-width:720px){
  .hero{grid-template-columns:1fr;gap:16px;padding-top:32px}
  .facts{grid-template-columns:repeat(2,auto)}
  .row{grid-template-columns:32px minmax(0,1fr) 56px;gap:12px}
  .row .strip,.row .wstat{display:none}
  .text{padding:20px 18px 24px;font-size:17px}
  .text p{padding-left:0}
  .pn{position:static;display:inline-block;margin-right:8px;vertical-align:2px}
  .summary{grid-template-columns:1fr;gap:12px}
  .big{font-size:60px}
  .bt span{display:none}
  .clock{font-size:17px;padding:4px 6px}
  .barin{gap:6px}
  .btn{padding:8px 12px}
  .phrases{columns:1}
  .topin .muted{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = [{"t":"Redes elétricas inteligentes","en":"Smart grids and demand response","x":[{"h":"From Passive Networks to Smart Grids","p":["For most of the twentieth century, electrical grids were designed around a simple principle: large power plants generated electricity, and transmission and distribution networks delivered it to passive consumers. Power flowed in one direction, and utilities had limited visibility of what happened beyond their substations. This model worked well as long as demand was predictable and generation was centralized.","However, the rapid growth of distributed energy resources, such as rooftop solar panels and small wind turbines, has challenged this paradigm. Today, a household may consume energy in the evening and inject surplus power into the network at noon. As a result, distribution networks must now handle bidirectional power flows, which can cause voltage rises and overload equipment that was never designed for such conditions.","The smart grid concept addresses these challenges by combining the physical power system with communication and information technologies. Advanced metering infrastructure (AMI), for instance, allows utilities to collect consumption data at intervals of a few minutes rather than once a month. This information enables more accurate load forecasting and makes it possible to offer time-of-use tariffs, which encourage customers to shift their consumption to off-peak hours.","Nevertheless, the digitalization of the grid also introduces new risks. Since control systems are increasingly connected to public networks, they become potential targets for cyberattacks. Therefore, engineers must consider cybersecurity as a design requirement rather than an afterthought."]},{"h":"Demand Response: Turning Consumers into Resources","p":["Demand response (DR) refers to changes in electricity use by end consumers in response to price signals or incentive payments. Instead of building expensive peaking plants that operate only a few hours per year, system operators can ask large consumers to reduce their load during critical periods.","DR programs are commonly divided into two categories. In price-based programs, customers voluntarily adjust their consumption according to time-varying tariffs. In incentive-based programs, on the other hand, customers receive payments for agreeing to reduce their demand when requested by the operator. Industrial facilities with flexible processes, such as water pumping or refrigeration, are particularly suitable for the latter.","Although DR has been studied for decades, its large-scale adoption was hindered by the lack of automation. Early programs relied on phone calls to notify participants, which made response times too slow for many grid services. Modern systems, in contrast, use standardized communication protocols that allow appliances and building management systems to respond automatically within seconds.","Despite these advances, residential participation remains low in many countries. Studies suggest that consumers are often unwilling to sacrifice comfort for small financial gains, which highlights the importance of user-centered program design."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, o modelo tradicional de rede elétrica funcionava bem enquanto:","o":["as concessionárias tinham total visibilidade dos consumidores.","os consumidores injetavam energia na rede.","a demanda era previsível e a geração, centralizada.","as usinas eram substituídas por geração distribuída."],"a":2,"e":"§1: 'This model worked well as long as demand was predictable and generation was centralized.'"},{"t":0,"s":"No parágrafo 2, a palavra *However* introduz uma ideia de:","o":["consequência","exemplificação","adição","contraste"],"a":3,"e":"'However' (entretanto) opõe a nova realidade ao modelo do §1."},{"t":0,"s":"De acordo com o Texto 1, os fluxos bidirecionais de potência podem:","o":["tornar a demanda mais previsível.","provocar elevação de tensão e sobrecarga de equipamentos.","eliminar a necessidade de subestações.","reduzir as perdas nas linhas de transmissão."],"a":1,"e":"§2: 'can cause voltage rises and overload equipment'."},{"t":0,"s":"A expressão *As a result* (parágrafo 2) pode ser traduzida por:","o":["Como resultado","Além disso","Por exemplo","Apesar disso"],"a":0,"e":"Conectivo de consequência."},{"t":0,"s":"Segundo o parágrafo 3, a infraestrutura de medição avançada (AMI) permite:","o":["impedir ataques cibernéticos.","coletar dados de consumo em intervalos de poucos minutos.","eliminar a cobrança mensal de energia.","gerar energia nos horários de pico."],"a":1,"e":"§3: 'collect consumption data at intervals of a few minutes rather than once a month'."},{"t":0,"s":"No parágrafo 3, o pronome *which* em 'which encourage customers' refere-se a:","o":["utilities","load forecasting","off-peak hours","time-of-use tariffs"],"a":3,"e":"São as tarifas horárias que incentivam o deslocamento do consumo."},{"t":0,"s":"O termo *off-peak hours* (parágrafo 3) significa:","o":["horas extras","horários de manutenção","horários de pico","horários fora de pico"],"a":3,"e":"'Off-peak' = fora do pico de demanda."},{"t":0,"s":"De acordo com o parágrafo 4, a cibersegurança deve ser considerada:","o":["desnecessária em redes isoladas.","responsabilidade exclusiva dos consumidores.","um requisito de projeto.","um problema secundário, tratado após a implantação."],"a":2,"e":"'as a design requirement rather than an afterthought'."},{"t":0,"s":"A palavra *afterthought* (parágrafo 4) indica algo:","o":["pensado apenas posteriormente.","planejado com antecedência.","proibido por norma.","essencial para o projeto."],"a":0,"e":"'Afterthought' = algo considerado só depois, de forma tardia."},{"t":0,"s":"Qual é a ideia central do Texto 1?","o":["A medição mensal é mais confiável que a medição avançada.","As redes inteligentes integram tecnologia da informação ao sistema elétrico para enfrentar novos desafios, mas trazem novos riscos.","As redes inteligentes tornam desnecessária a geração centralizada.","A geração distribuída deve ser proibida para proteger a rede."],"a":1,"e":"O texto apresenta o problema, a solução (smart grid) e os riscos dela."},{"t":1,"s":"Segundo o Texto 2, a resposta da demanda (DR) consiste em:","o":["mudanças no uso de eletricidade pelos consumidores em resposta a preços ou incentivos.","aumentar o consumo durante períodos críticos.","construir usinas de ponta para os horários críticos.","substituir medidores convencionais por medidores inteligentes."],"a":0,"e":"Definição no §1."},{"t":1,"s":"De acordo com o parágrafo 1 do Texto 2, uma vantagem da DR é:","o":["eliminar a necessidade de operadores do sistema.","aumentar a receita das usinas de ponta.","reduzir o preço dos equipamentos residenciais.","evitar a construção de usinas caras que operam poucas horas por ano."],"a":3,"e":"'Instead of building expensive peaking plants that operate only a few hours per year'."},{"t":1,"s":"No parágrafo 2, a expressão *on the other hand* estabelece:","o":["uma relação de causa.","uma condição.","uma conclusão.","um contraste entre os dois tipos de programa."],"a":3,"e":"'On the other hand' = por outro lado."},{"t":1,"s":"A expressão *the latter* (parágrafo 2) refere-se a:","o":["price-based programs","industrial facilities","incentive-based programs","time-varying tariffs"],"a":2,"e":"'The latter' retoma o último item citado: os programas baseados em incentivos."},{"t":1,"s":"Segundo o Texto 2, instalações industriais com processos flexíveis são citadas como:","o":["as maiores responsáveis pelos picos de demanda.","exemplos de consumidores residenciais.","particularmente adequadas aos programas baseados em incentivos.","incapazes de reduzir a carga rapidamente."],"a":2,"e":"§2, última frase."},{"t":1,"s":"Conforme o parágrafo 3, a adoção em larga escala da DR foi dificultada:","o":["pela falta de automação.","pela resistência das concessionárias.","pelo alto custo das tarifas horárias.","pelo excesso de protocolos padronizados."],"a":0,"e":"'its large-scale adoption was hindered by the lack of automation'."},{"t":1,"s":"A palavra *hindered* (parágrafo 3) pode ser substituída, sem alteração de sentido, por:","o":["supported","accelerated","hampered","required"],"a":2,"e":"'Hinder' e 'hamper' significam dificultar."},{"t":1,"s":"De acordo com o parágrafo 3, os sistemas modernos de DR:","o":["ainda dependem de chamadas telefônicas.","respondem automaticamente em segundos por meio de protocolos padronizados.","funcionam apenas em edifícios comerciais.","são mais lentos que os programas iniciais."],"a":1,"e":"'respond automatically within seconds'."},{"t":1,"s":"O termo *Despite* (parágrafo 4) tem sentido equivalente a:","o":["Apesar de","Além de","Em vez de","Devido a"],"a":0,"e":"Conectivo concessivo."},{"t":1,"s":"Segundo o parágrafo 4, a baixa participação residencial pode ser explicada porque os consumidores:","o":["desconhecem a existência da tarifa horária.","não querem abrir mão do conforto por pequenos ganhos financeiros.","preferem programas industriais.","não têm acesso a protocolos de comunicação."],"a":1,"e":"'unwilling to sacrifice comfort for small financial gains'."}],"w":["Explique, em inglês, por que a geração distribuída (como painéis solares residenciais) representa um desafio para as redes de distribuição tradicionais.","Em inglês, discuta se programas de resposta da demanda poderiam ter sucesso entre consumidores residenciais no Brasil. Apresente ao menos um argumento."]},{"t":"Semicondutores de banda larga","en":"Wide-bandgap power electronics","x":[{"h":"Beyond Silicon: SiC and GaN Devices","p":["For more than five decades, silicon has been the dominant material in power semiconductor devices. Silicon MOSFETs and IGBTs are reliable, inexpensive and well understood. However, as engineers push for converters that are smaller, lighter and more efficient, the physical limits of silicon have become a major obstacle.","Wide-bandgap (WBG) materials, mainly silicon carbide (SiC) and gallium nitride (GaN), offer a way to overcome these limits. Because their bandgap is roughly three times larger than that of silicon, they can withstand much higher electric fields. Consequently, a WBG device can block the same voltage with a thinner drift layer, which reduces its on-state resistance and, therefore, its conduction losses.","Another key advantage is switching speed. WBG transistors can turn on and off in a few nanoseconds, which allows converters to operate at higher switching frequencies. Since the size of inductors and capacitors decreases as frequency increases, designers can build much more compact power supplies. SiC devices can also operate at higher temperatures, which simplifies cooling systems in electric vehicles and industrial drives.","These benefits, nevertheless, come with new difficulties. Very fast voltage transitions generate electromagnetic interference and may stress the insulation of motor windings. In addition, parasitic inductances in the circuit layout, which were negligible with slower devices, can now cause severe voltage overshoots."]},{"h":"Designing Gate Drivers for Fast Switches","p":["The gate driver is the circuit that controls the switching of a power transistor. Although it is often treated as a minor component, its design has a decisive influence on the performance of WBG converters.","GaN transistors, for example, have a low threshold voltage and a narrow safe range for the gate signal. If the gate voltage exceeds the maximum rating by only a few volts, the device may be permanently damaged. For this reason, the driver must provide precise voltage levels and keep the gate loop as short as possible.","A second concern is the so-called Miller effect. During fast transitions, current flowing through the parasitic capacitance between drain and gate can raise the gate voltage and turn the device on unintentionally. To prevent this, many drivers apply a negative voltage during the off state or include an active clamping circuit.","Finally, isolation is essential in high-voltage applications. Modern drivers integrate digital isolators that transmit control signals across a barrier while protecting low-voltage control electronics. Thus, a carefully designed gate driver is not a detail but a condition for exploiting the full potential of WBG devices."]}],"q":[{"t":0,"s":"De acordo com o parágrafo 1 do Texto 1, o silício tornou-se um obstáculo porque:","o":["seus limites físicos impedem conversores menores, mais leves e mais eficientes.","é um material caro e pouco confiável.","seu comportamento ainda é pouco compreendido.","não pode ser usado em MOSFETs."],"a":0,"e":"§1: 'the physical limits of silicon have become a major obstacle'."},{"t":0,"s":"A expressão *more than five decades* (parágrafo 1) significa:","o":["mais de quinze anos.","menos de cinco décadas.","cerca de cinco anos.","mais de cinquenta anos."],"a":3,"e":"'Decade' = década (10 anos)."},{"t":0,"s":"Segundo o parágrafo 2, os materiais WBG suportam campos elétricos mais altos porque:","o":["são três vezes mais baratos que o silício.","operam em temperaturas mais baixas.","sua banda proibida é cerca de três vezes maior que a do silício.","possuem camadas de deriva mais espessas."],"a":2,"e":"'Because their bandgap is roughly three times larger'."},{"t":0,"s":"No parágrafo 2, a palavra *Consequently* indica:","o":["oposição","consequência","comparação","concessão"],"a":1,"e":"'Consequently' = consequentemente."},{"t":0,"s":"Segundo o Texto 1, uma camada de deriva mais fina resulta em:","o":["necessidade de sistemas de refrigeração maiores.","menor velocidade de comutação.","menor resistência em condução e menores perdas de condução.","maior tensão de bloqueio e maiores perdas."],"a":2,"e":"§2: 'reduces its on-state resistance and, therefore, its conduction losses'."},{"t":0,"s":"De acordo com o parágrafo 3, fontes de alimentação mais compactas são possíveis porque:","o":["a interferência eletromagnética diminui.","os transistores WBG dispensam capacitores.","a temperatura de operação é mais baixa.","indutores e capacitores ficam menores com o aumento da frequência."],"a":3,"e":"'the size of inductors and capacitors decreases as frequency increases'."},{"t":0,"s":"No parágrafo 3, o pronome *which* em 'which simplifies cooling systems' refere-se:","o":["à capacidade do SiC de operar em temperaturas mais altas.","à frequência de comutação.","aos indutores.","aos veículos elétricos."],"a":0,"e":"Retoma a oração anterior sobre operação em alta temperatura."},{"t":0,"s":"Assinale a alternativa que NÃO é mencionada no parágrafo 4 como dificuldade dos dispositivos WBG:","o":["sobretensões causadas por indutâncias parasitas.","custo de fabricação mais elevado.","interferência eletromagnética.","estresse no isolamento dos enrolamentos de motores."],"a":1,"e":"O custo não é citado no texto."},{"t":0,"s":"A palavra *negligible* (parágrafo 4) significa:","o":["mensurável","perigosa","essencial","desprezível"],"a":3,"e":"'Negligible' = que pode ser desprezado."},{"t":0,"s":"No parágrafo 4, *In addition* pode ser substituído por:","o":["Otherwise","Moreover","However","Therefore"],"a":1,"e":"Ambos indicam adição."},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, o driver de gate:","o":["substitui o transistor de potência.","tem influência decisiva no desempenho dos conversores WBG, embora seja visto como componente secundário.","é um componente de importância secundária.","é usado apenas em conversores de silício."],"a":1,"e":"'Although it is often treated as a minor component, its design has a decisive influence'."},{"t":1,"s":"A palavra *Although* (parágrafo 1) introduz uma ideia de:","o":["finalidade","tempo","concessão","causa"],"a":2,"e":"'Although' = embora."},{"t":1,"s":"De acordo com o parágrafo 2, transistores GaN podem ser danificados permanentemente se:","o":["a tensão de gate exceder o valor máximo em apenas alguns volts.","a tensão de limiar for alta.","o driver fornecer níveis de tensão precisos.","o laço de gate for muito curto."],"a":0,"e":"'If the gate voltage exceeds the maximum rating by only a few volts'."},{"t":1,"s":"A expressão *For this reason* (parágrafo 2) poderia ser traduzida por:","o":["Em vez disso","Apesar disso","Por essa razão","Ao mesmo tempo"],"a":2,"e":"Conectivo de conclusão/consequência."},{"t":1,"s":"Segundo o parágrafo 3, o efeito Miller pode:","o":["ligar o dispositivo de forma não intencional.","reduzir a capacitância parasita.","desligar o driver permanentemente.","proteger o gate contra sobretensões."],"a":0,"e":"'can raise the gate voltage and turn the device on unintentionally'."},{"t":1,"s":"Como solução para o efeito Miller, o texto menciona:","o":["reduzir a frequência de comutação para zero.","aumentar a capacitância entre dreno e gate.","eliminar o isolamento digital.","aplicar tensão negativa no estado desligado ou usar um circuito de grampeamento ativo."],"a":3,"e":"§3, última frase."},{"t":1,"s":"No parágrafo 3, *To prevent this*, o pronome *this* refere-se:","o":["ao driver de gate.","à tensão negativa.","ao circuito de grampeamento.","ao acionamento indesejado do dispositivo."],"a":3,"e":"Retoma 'turn the device on unintentionally'."},{"t":1,"s":"Segundo o parágrafo 4, os isoladores digitais:","o":["transmitem sinais de controle através de uma barreira, protegendo a eletrônica de baixa tensão.","eliminam a necessidade de drivers.","são usados apenas em baixa tensão.","aumentam a tensão do gate."],"a":0,"e":"§4, segunda frase."},{"t":1,"s":"A palavra *Thus* (parágrafo 4) tem sentido de:","o":["Entretanto","Por exemplo","Assim / portanto","Além disso"],"a":2,"e":"Conectivo conclusivo."},{"t":1,"s":"A ideia central do Texto 2 é que:","o":["o efeito Miller torna os dispositivos WBG inviáveis.","um driver de gate bem projetado é condição para aproveitar todo o potencial dos dispositivos WBG.","os transistores GaN são inferiores aos de SiC.","o isolamento é dispensável em alta tensão."],"a":1,"e":"Conclusão do §4."}],"w":["Em inglês, descreva as principais vantagens dos dispositivos de SiC e GaN em relação ao silício na eletrônica de potência.","Em inglês, explique por que a alta velocidade de comutação dos dispositivos WBG pode ser, ao mesmo tempo, uma vantagem e um problema."]},{"t":"Energia solar fotovoltaica","en":"Photovoltaic systems and MPPT","x":[{"h":"The Rise of Photovoltaic Generation","p":["Photovoltaic (PV) generation has become one of the fastest-growing sources of electricity in the world. The cost of PV modules has fallen by more than 80% over the last decade, mainly due to improvements in manufacturing and economies of scale. In many sunny regions, solar energy is now cheaper than electricity from new fossil-fuel plants.","A PV cell converts sunlight directly into electricity through the photovoltaic effect. When photons with sufficient energy strike the semiconductor, they generate electron-hole pairs, which are separated by the internal electric field of the p-n junction. The resulting current depends mainly on irradiance, whereas the voltage is more strongly affected by temperature.","Since a single cell produces only about 0.6 V, cells are connected in series to form modules, and modules are combined into strings and arrays. This arrangement, however, makes the system sensitive to partial shading. If one cell is shaded, it may limit the current of the entire string and even become reverse biased, dissipating power as heat. To reduce this problem, bypass diodes are installed across groups of cells.","Finally, PV arrays generate direct current, while most loads and the grid operate with alternating current. Therefore, an inverter is required to connect the system to the grid. Modern inverters also perform functions such as voltage support and anti-islanding protection."]},{"h":"Maximum Power Point Tracking","p":["The current-voltage curve of a PV module has a single point at which the product of voltage and current is maximum. This point, known as the maximum power point (MPP), changes continuously with irradiance and temperature. In order to extract as much energy as possible, PV converters use maximum power point tracking (MPPT) algorithms.","The most popular algorithm is Perturb and Observe (P&O). It periodically changes the operating voltage by a small step and measures the resulting power. If the power increases, the next perturbation is made in the same direction; otherwise, the direction is reversed. Its main advantages are simplicity and low computational cost.","Nonetheless, P&O has well-known drawbacks. Because the operating point keeps oscillating around the MPP, some energy is lost even under constant conditions. Moreover, under rapidly changing irradiance, the algorithm may move in the wrong direction. Under partial shading, the power curve may present several local maxima, and simple algorithms can become trapped in one of them.","For these reasons, researchers have proposed methods based on optimization techniques, such as particle swarm optimization, which are able to locate the global maximum. These methods, however, require more processing power and longer tracking times."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, a queda no custo dos módulos fotovoltaicos deve-se principalmente:","o":["a melhorias na fabricação e a economias de escala.","à redução da irradiância solar.","a subsídios governamentais.","ao aumento do preço dos combustíveis fósseis."],"a":0,"e":"'mainly due to improvements in manufacturing and economies of scale'."},{"t":0,"s":"A expressão *mainly due to* (parágrafo 1) significa:","o":["juntamente com","apesar de","em vez de","principalmente devido a"],"a":3,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, os pares elétron-lacuna são separados:","o":["pelo campo elétrico interno da junção p-n.","pelos diodos de bypass.","pelo inversor.","pelos fótons incidentes."],"a":0,"e":"'separated by the internal electric field of the p-n junction'."},{"t":0,"s":"No parágrafo 2, a palavra *whereas* estabelece:","o":["uma relação de causa e efeito.","um contraste entre os fatores que afetam corrente e tensão.","uma sequência temporal.","uma condição."],"a":1,"e":"'Whereas' = enquanto (contraste)."},{"t":0,"s":"Segundo o Texto 1, a tensão de uma célula fotovoltaica é mais afetada:","o":["pela temperatura.","pela irradiância.","pelo número de módulos.","pelo inversor."],"a":0,"e":"'the voltage is more strongly affected by temperature'."},{"t":0,"s":"De acordo com o parágrafo 3, as células são conectadas em série porque:","o":["isso elimina o problema do sombreamento.","aumenta a corrente da string.","reduz o custo dos diodos.","uma única célula produz apenas cerca de 0,6 V."],"a":3,"e":"'Since a single cell produces only about 0.6 V'."},{"t":0,"s":"Segundo o parágrafo 3, uma célula sombreada pode:","o":["desligar o inversor automaticamente.","limitar a corrente de toda a string e dissipar potência como calor.","aumentar a tensão do módulo.","melhorar a eficiência do arranjo."],"a":1,"e":"§3."},{"t":0,"s":"No parágrafo 3, *To reduce this problem*, o termo *this problem* refere-se:","o":["à corrente alternada.","aos efeitos do sombreamento parcial.","à baixa tensão da célula.","ao custo dos módulos."],"a":1,"e":""},{"t":0,"s":"Segundo o parágrafo 4, o inversor é necessário porque:","o":["os módulos produzem corrente alternada instável.","a rede opera em corrente contínua.","os arranjos fotovoltaicos geram corrente contínua e a rede opera em corrente alternada.","os diodos de bypass exigem conversão."],"a":2,"e":"§4."},{"t":0,"s":"Além da conversão CC-CA, os inversores modernos, segundo o texto:","o":["substituem os diodos de bypass.","eliminam o sombreamento parcial.","oferecem suporte de tensão e proteção anti-ilhamento.","aumentam a irradiância."],"a":2,"e":"'voltage support and anti-islanding protection'."},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, o ponto de máxima potência (MPP):","o":["muda continuamente com a irradiância e a temperatura.","é fixo para cada módulo.","ocorre sempre na tensão de circuito aberto.","depende apenas da corrente."],"a":0,"e":"'changes continuously with irradiance and temperature'."},{"t":1,"s":"A expressão *In order to* (parágrafo 1) indica:","o":["tempo","consequência","finalidade","oposição"],"a":2,"e":"'In order to' = a fim de."},{"t":1,"s":"De acordo com o parágrafo 2, o algoritmo P&O inverte a direção da perturbação quando:","o":["a tensão permanece constante.","a potência não aumenta.","a irradiância é máxima.","a potência aumenta."],"a":1,"e":"'If the power increases... otherwise, the direction is reversed'."},{"t":1,"s":"A palavra *otherwise* (parágrafo 2) significa:","o":["da mesma forma","portanto","caso contrário","além disso"],"a":2,"e":""},{"t":1,"s":"Segundo o Texto 2, as principais vantagens do P&O são:","o":["simplicidade e baixo custo computacional.","precisão absoluta e rapidez.","capacidade de encontrar o máximo global.","ausência de oscilações."],"a":0,"e":"'Its main advantages are simplicity and low computational cost'."},{"t":1,"s":"A palavra *drawbacks* (parágrafo 3) significa:","o":["etapas","desvantagens","vantagens","resultados"],"a":1,"e":"'Drawback' = desvantagem, inconveniente."},{"t":1,"s":"Segundo o parágrafo 3, mesmo em condições constantes, o P&O perde energia porque:","o":["há vários máximos locais.","a irradiância muda rapidamente.","o ponto de operação oscila em torno do MPP.","o algoritmo para de funcionar."],"a":2,"e":"'Because the operating point keeps oscillating around the MPP'."},{"t":1,"s":"De acordo com o Texto 2, sob sombreamento parcial:","o":["a curva de potência torna-se linear.","o P&O sempre encontra o máximo global.","o MPP desaparece.","a curva de potência pode apresentar vários máximos locais."],"a":3,"e":"§3, última frase."},{"t":1,"s":"Segundo o parágrafo 4, métodos baseados em otimização, como o enxame de partículas:","o":["não funcionam sob sombreamento.","eliminam a necessidade de inversores.","são mais simples que o P&O.","localizam o máximo global, mas exigem mais processamento e mais tempo."],"a":3,"e":"§4."},{"t":1,"s":"No parágrafo 4, *These methods* refere-se:","o":["aos máximos locais.","aos diodos de bypass.","ao algoritmo P&O.","aos métodos baseados em técnicas de otimização."],"a":3,"e":""}],"w":["Em inglês, explique como o sombreamento parcial afeta um sistema fotovoltaico e como esse problema pode ser reduzido.","Em inglês, descreva o funcionamento do algoritmo Perturb and Observe, mencionando uma vantagem e uma limitação."]},{"t":"Armazenamento em baterias","en":"Battery energy storage","x":[{"h":"Batteries in the Power System","p":["Energy storage is often described as the missing piece of the energy transition. Because the output of wind and solar plants depends on the weather, the power system needs resources that can store energy when it is abundant and release it when it is scarce. Among the available technologies, lithium-ion batteries have become the leading option for short-duration storage.","Battery energy storage systems (BESS) can provide several services. They can shift solar energy from midday to the evening peak, a practice known as energy arbitrage. They can also respond within milliseconds to frequency deviations, a task that conventional generators perform much more slowly. In isolated systems, such as islands, batteries may even replace diesel generators for part of the day.","Despite their versatility, batteries have important limitations. Their energy capacity is usually sufficient for only a few hours of operation, which makes them unsuitable for seasonal storage. Furthermore, their performance degrades over time: each charge and discharge cycle slightly reduces the available capacity.","The economic viability of a BESS therefore depends on how it is operated. An operation strategy that maximizes short-term revenue may accelerate degradation and shorten the useful life of the system. Engineers must consequently balance immediate profits against long-term costs."]},{"h":"The Role of the Battery Management System","p":["A battery pack used in an electric vehicle or a stationary system may contain thousands of individual cells. Although these cells are manufactured to be identical, small differences in capacity and internal resistance are unavoidable. Over many cycles, these differences tend to grow, and some cells may become overcharged while others are not fully charged.","The battery management system (BMS) is responsible for preventing such situations. It continuously measures the voltage, current and temperature of the cells and disconnects the pack if any value exceeds safe limits. Overcharging a lithium-ion cell, for instance, can lead to thermal runaway, a chain reaction that may result in fire.","Another essential function of the BMS is cell balancing. Passive balancing dissipates the excess energy of the most charged cells in resistors, whereas active balancing transfers energy from stronger cells to weaker ones. The latter is more efficient but also more complex and expensive.","Finally, the BMS estimates the state of charge (SoC) and the state of health (SoH) of the battery. Since these quantities cannot be measured directly, they are calculated with models and filtering techniques, such as the Kalman filter. Accurate estimation is crucial: an error of a few percent in the SoC may leave a driver stranded."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, o sistema elétrico precisa de armazenamento porque:","o":["os geradores convencionais estão sendo proibidos.","a demanda é constante ao longo do dia.","a produção das usinas eólicas e solares depende do clima.","as baterias são mais baratas que as usinas."],"a":2,"e":"'Because the output of wind and solar plants depends on the weather'."},{"t":0,"s":"A expressão *the missing piece* (parágrafo 1) sugere que o armazenamento é:","o":["um elemento que ainda falta para completar a transição energética.","um componente desnecessário.","um problema sem solução.","uma tecnologia ultrapassada."],"a":0,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, *energy arbitrage* consiste em:","o":["comprar baterias em grande quantidade.","controlar a frequência da rede.","substituir geradores a diesel.","deslocar a energia solar do meio-dia para o pico da noite."],"a":3,"e":"'shift solar energy from midday to the evening peak, a practice known as energy arbitrage'."},{"t":0,"s":"Segundo o Texto 1, em comparação com geradores convencionais, as baterias:","o":["respondem mais lentamente a desvios de frequência.","têm o mesmo tempo de resposta.","não podem regular a frequência.","respondem muito mais rapidamente a desvios de frequência."],"a":3,"e":"'within milliseconds... a task that conventional generators perform much more slowly'."},{"t":0,"s":"No parágrafo 2, *may even replace* indica:","o":["um fato passado.","uma obrigação.","uma proibição.","uma possibilidade."],"a":3,"e":"'May' expressa possibilidade."},{"t":0,"s":"Segundo o parágrafo 3, as baterias são inadequadas para armazenamento sazonal porque:","o":["não podem ser recarregadas.","respondem lentamente.","degradam-se apenas em longos períodos.","sua capacidade de energia normalmente basta para apenas algumas horas."],"a":3,"e":"§3."},{"t":0,"s":"A palavra *Furthermore* (parágrafo 3) pode ser substituída por:","o":["Thus","Instead","In addition","Nevertheless"],"a":2,"e":"Ambos indicam adição."},{"t":0,"s":"De acordo com o Texto 1, cada ciclo de carga e descarga:","o":["elimina a degradação.","reduz ligeiramente a capacidade disponível.","não afeta o desempenho.","aumenta a capacidade da bateria."],"a":1,"e":"'each charge and discharge cycle slightly reduces the available capacity'."},{"t":0,"s":"Segundo o parágrafo 4, uma estratégia que maximiza a receita de curto prazo pode:","o":["eliminar a necessidade de manutenção.","acelerar a degradação e encurtar a vida útil do sistema.","reduzir custos de longo prazo.","prolongar a vida útil da bateria."],"a":1,"e":""},{"t":0,"s":"A palavra *therefore* (parágrafo 4) indica:","o":["exemplo","oposição","conclusão","adição"],"a":2,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, as diferenças entre células:","o":["são inevitáveis e tendem a aumentar com os ciclos.","afetam apenas veículos elétricos.","diminuem com o uso.","não existem, pois as células são idênticas."],"a":0,"e":"'small differences... are unavoidable... these differences tend to grow'."},{"t":1,"s":"A palavra *unavoidable* (parágrafo 1) significa:","o":["inevitáveis","desprezíveis","indesejáveis","mensuráveis"],"a":0,"e":""},{"t":1,"s":"De acordo com o parágrafo 2, o BMS desconecta o pacote quando:","o":["a bateria está totalmente carregada.","algum valor medido excede os limites seguros.","o veículo está parado.","a temperatura está abaixo do normal."],"a":1,"e":""},{"t":1,"s":"Segundo o Texto 2, a fuga térmica (*thermal runaway*) é:","o":["um método de balanceamento de células.","um tipo de filtro de estimação.","uma técnica para aumentar a capacidade.","uma reação em cadeia que pode resultar em incêndio."],"a":3,"e":"§2."},{"t":1,"s":"No parágrafo 2, *for instance* pode ser traduzido por:","o":["além disso","por fim","por exemplo","no entanto"],"a":2,"e":""},{"t":1,"s":"De acordo com o parágrafo 3, o balanceamento passivo:","o":["é o método mais caro.","é mais eficiente que o ativo.","dissipa o excesso de energia das células mais carregadas em resistores.","transfere energia das células mais fortes para as mais fracas."],"a":2,"e":""},{"t":1,"s":"No parágrafo 3, *The latter* refere-se:","o":["ao balanceamento ativo.","ao balanceamento passivo.","aos resistores.","às células mais fracas."],"a":0,"e":"'The latter' = o último mencionado."},{"t":1,"s":"Segundo o parágrafo 4, o estado de carga (SoC) e o estado de saúde (SoH):","o":["dependem apenas da temperatura.","não podem ser medidos diretamente e são estimados por modelos e filtros.","são medidos diretamente por sensores.","não são importantes para o motorista."],"a":1,"e":""},{"t":1,"s":"A expressão *leave a driver stranded* (parágrafo 4) indica que o motorista poderia:","o":["trocar a bateria facilmente.","ficar parado sem carga, sem conseguir prosseguir.","economizar energia.","receber informações precisas."],"a":1,"e":"'Stranded' = encalhado, sem poder seguir viagem."},{"t":1,"s":"Assinale a alternativa que NÃO corresponde a uma função do BMS segundo o Texto 2:","o":["fabricar células com capacidades idênticas.","medir tensão, corrente e temperatura.","estimar SoC e SoH.","balancear as células."],"a":0,"e":"Fabricar células não é função do BMS."}],"w":["Em inglês, descreva dois serviços que sistemas de armazenamento em baterias podem oferecer à rede elétrica.","Em inglês, explique por que o sistema de gerenciamento de baterias (BMS) é essencial para a segurança de um veículo elétrico."]},{"t":"Energia eólica","en":"Wind energy conversion","x":[{"h":"Harnessing the Wind","p":["Wind power has grown from a niche technology into a major source of electricity in many countries, including Brazil, where wind farms in the Northeast region operate with some of the highest capacity factors in the world. The capacity factor is the ratio between the energy actually produced and the energy that would be produced if the turbine operated at rated power all the time.","The power available in the wind is proportional to the cube of the wind speed. In other words, if the wind speed doubles, the available power increases eightfold. This relationship explains why developers invest heavily in measurement campaigns before choosing a site: small errors in the estimated wind speed lead to large errors in the expected energy production.","However, a turbine cannot extract all the power available in the wind. According to Betz's law, no turbine can capture more than about 59% of the kinetic energy of the air flowing through its rotor. Modern turbines reach approximately 45% to 50% under optimal conditions.","To maximize energy capture, turbines adjust their rotor speed and the pitch angle of their blades. At low wind speeds, the controller seeks to operate at the optimal tip-speed ratio. Above rated wind speed, on the other hand, the blades are pitched to limit the power and protect the mechanical structure."]},{"h":"Generators for Variable-Speed Turbines","p":["Early wind turbines operated at a nearly constant speed, using squirrel-cage induction generators connected directly to the grid. These machines were robust and cheap, but they could not adapt their speed to the wind, which reduced efficiency and increased mechanical stress.","Most modern turbines are variable-speed machines. The doubly-fed induction generator (DFIG) has been one of the most widely used configurations. In a DFIG, the stator is connected directly to the grid, while the rotor is connected through a back-to-back power converter. Since this converter handles only about 30% of the rated power, it is smaller and cheaper than a full-scale converter.","Nevertheless, the DFIG is vulnerable to grid faults. A sudden voltage dip induces high currents in the rotor, which may damage the converter. Grid codes now require turbines to remain connected during such events, a capability known as fault ride-through. Meeting this requirement demands protection circuits and sophisticated control strategies.","An alternative is the permanent magnet synchronous generator with a full-scale converter. Although this solution is more expensive, it decouples the generator from the grid and offers better fault ride-through performance. As a result, it has become common in large offshore turbines."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, o fator de capacidade é:","o":["a velocidade média do vento em um local.","a razão entre a energia efetivamente produzida e a que seria produzida operando sempre na potência nominal.","o número de turbinas de um parque eólico.","a potência máxima de uma turbina."],"a":1,"e":"Definição no §1."},{"t":0,"s":"De acordo com o Texto 1, os parques eólicos do Nordeste brasileiro:","o":["operam com alguns dos maiores fatores de capacidade do mundo.","foram desativados recentemente.","têm os menores fatores de capacidade do mundo.","usam apenas turbinas de velocidade fixa."],"a":0,"e":""},{"t":0,"s":"Segundo o parágrafo 2, se a velocidade do vento dobra, a potência disponível:","o":["aumenta oito vezes.","permanece a mesma.","quadruplica.","dobra."],"a":0,"e":"Potência proporcional ao cubo da velocidade: 2³ = 8."},{"t":0,"s":"A expressão *In other words* (parágrafo 2) indica:","o":["oposição","conclusão de um argumento contrário","reformulação/explicação","exemplo de exceção"],"a":2,"e":"'In other words' = em outras palavras."},{"t":0,"s":"Segundo o parágrafo 2, os desenvolvedores investem em campanhas de medição porque:","o":["pequenos erros na velocidade estimada geram grandes erros na produção esperada.","as turbinas são baratas.","a lei de Betz exige medições.","o vento é constante."],"a":0,"e":""},{"t":0,"s":"De acordo com a lei de Betz, mencionada no parágrafo 3:","o":["toda a energia do vento pode ser extraída.","as turbinas modernas captam 59% da energia.","nenhuma turbina pode captar mais que cerca de 59% da energia cinética do vento.","turbinas maiores superam o limite de 59%."],"a":2,"e":""},{"t":0,"s":"A palavra *approximately* (parágrafo 3) significa:","o":["no máximo","exatamente","raramente","aproximadamente"],"a":3,"e":""},{"t":0,"s":"Segundo o parágrafo 4, acima da velocidade nominal do vento, as pás são ajustadas para:","o":["operar na razão de velocidade ótima.","parar o rotor completamente.","maximizar a potência captada.","limitar a potência e proteger a estrutura mecânica."],"a":3,"e":""},{"t":0,"s":"No parágrafo 4, *on the other hand* contrapõe:","o":["a operação em baixas velocidades à operação acima da velocidade nominal.","turbinas antigas a turbinas modernas.","o Brasil a outros países.","geradores síncronos a assíncronos."],"a":0,"e":""},{"t":0,"s":"O termo *pitch angle* (parágrafo 4) refere-se:","o":["à velocidade do rotor.","à altura da torre.","ao ângulo de passo das pás.","à direção do vento."],"a":2,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, as primeiras turbinas eólicas:","o":["operavam em velocidade variável.","operavam em velocidade quase constante e não se adaptavam ao vento.","usavam conversores de escala plena.","eram caras e frágeis."],"a":1,"e":""},{"t":1,"s":"No parágrafo 1, *which reduced efficiency*, o pronome *which* refere-se:","o":["ao baixo custo das máquinas.","ao fato de não adaptarem a velocidade ao vento.","ao gerador de indução.","à rede elétrica."],"a":1,"e":""},{"t":1,"s":"De acordo com o parágrafo 2, no DFIG:","o":["o conversor processa 100% da potência.","não há conversor de potência.","o rotor é conectado diretamente à rede.","o estator é conectado diretamente à rede e o rotor, por meio de um conversor."],"a":3,"e":""},{"t":1,"s":"Segundo o Texto 2, o conversor do DFIG é menor e mais barato porque:","o":["não precisa de controle.","processa apenas cerca de 30% da potência nominal.","opera em velocidade constante.","é conectado ao estator."],"a":1,"e":"'Since this converter handles only about 30% of the rated power'."},{"t":1,"s":"A palavra *Nevertheless* (parágrafo 3) poderia ser substituída por:","o":["Therefore","Similarly","Moreover","However"],"a":3,"e":"Ambos expressam contraste."},{"t":1,"s":"Segundo o parágrafo 3, um afundamento súbito de tensão pode:","o":["desligar o estator sem consequências.","reduzir a corrente no rotor.","induzir correntes elevadas no rotor e danificar o conversor.","aumentar a eficiência do gerador."],"a":2,"e":""},{"t":1,"s":"De acordo com o Texto 2, *fault ride-through* é:","o":["um código de rede para turbinas offshore.","a capacidade de a turbina permanecer conectada durante faltas na rede.","a desconexão imediata da turbina em uma falta.","um tipo de gerador síncrono."],"a":1,"e":""},{"t":1,"s":"No parágrafo 4, a palavra *Although* introduz:","o":["uma comparação de igualdade.","uma causa.","uma finalidade.","uma concessão (embora)."],"a":3,"e":""},{"t":1,"s":"Segundo o parágrafo 4, o gerador síncrono de ímãs permanentes com conversor pleno:","o":["é mais caro, mas tem melhor desempenho em faltas.","tem pior desempenho em faltas.","não é usado em turbinas offshore.","é mais barato que o DFIG."],"a":0,"e":""},{"t":1,"s":"A expressão *As a result* (parágrafo 4) introduz:","o":["uma oposição.","um exemplo.","uma consequência.","uma hipótese."],"a":2,"e":""}],"w":["Em inglês, explique por que a escolha do local é tão importante em projetos de energia eólica, considerando a relação entre velocidade do vento e potência.","Em inglês, compare o gerador de indução duplamente alimentado (DFIG) com o gerador síncrono de ímãs permanentes, citando uma vantagem de cada um."]},{"t":"Recarga de veículos elétricos","en":"Electric vehicle charging","x":[{"h":"Charging the Electric Fleet","p":["The number of electric vehicles (EVs) on the roads has increased sharply in recent years. While this trend contributes to lower urban pollution and greenhouse gas emissions, it also raises a question that concerns power engineers: can existing distribution networks supply the additional demand?","EV chargers are usually classified by power level. Slow chargers, typically installed in homes, use the on-board charger of the vehicle and deliver a few kilowatts. Fast DC chargers, by contrast, convert alternating current to direct current outside the vehicle and may supply more than 150 kW, allowing a battery to be recharged to 80% in less than half an hour.","The impact of charging on the grid depends largely on when it occurs. If many drivers plug in their vehicles as soon as they arrive home in the evening, charging will coincide with the residential demand peak. Distribution transformers could then become overloaded, which would shorten their lifetime.","Smart charging offers a solution. Instead of charging at full power immediately, the vehicle can postpone or modulate charging according to the needs of the grid, provided that the battery is ready at the time requested by the user. Studies indicate that coordinated charging could allow networks to accommodate a large number of EVs without major reinforcements."]},{"h":"Vehicle-to-Grid: Cars as Power Plants","p":["Most private cars remain parked for more than 90% of the day. This observation has inspired the concept of vehicle-to-grid (V2G), in which parked EVs not only draw energy from the grid but also return energy to it when needed.","In principle, a large fleet of connected vehicles could act as a distributed storage system, helping to balance supply and demand and to integrate variable renewable sources. For this to happen, the charger must be bidirectional, and the vehicle, the charger and the system operator must exchange information through common communication standards.","Several obstacles, however, still limit the adoption of V2G. Owners are concerned that additional cycles may accelerate battery degradation and reduce the value of their cars. Moreover, bidirectional chargers are more expensive than unidirectional ones, and regulatory frameworks in many countries do not yet define how vehicle owners should be paid for the services they provide.","Pilot projects have shown that V2G is technically feasible. Whether it will become economically attractive will depend on battery prices, market rules and the willingness of drivers to give up part of the control over their vehicles."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, a pergunta que preocupa os engenheiros é se:","o":["os veículos elétricos reduzem a poluição urbana.","as redes de distribuição existentes podem suprir a demanda adicional dos veículos elétricos.","o número de veículos elétricos continuará crescendo.","as emissões de gases de efeito estufa vão diminuir."],"a":1,"e":""},{"t":0,"s":"A palavra *sharply* (parágrafo 1) indica um aumento:","o":["acentuado","lento","temporário","irregular"],"a":0,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, os carregadores lentos:","o":["fornecem mais de 150 kW.","convertem CA em CC fora do veículo.","usam o carregador de bordo do veículo e fornecem poucos quilowatts.","são instalados em rodovias."],"a":2,"e":""},{"t":0,"s":"No parágrafo 2, *by contrast* introduz:","o":["um exemplo de carregador lento.","uma conclusão sobre carregadores residenciais.","um contraste entre carregadores lentos e rápidos.","uma causa para o uso de carregadores rápidos."],"a":2,"e":""},{"t":0,"s":"Segundo o Texto 1, um carregador rápido CC pode:","o":["fornecer apenas poucos quilowatts.","recarregar a bateria até 80% em menos de meia hora.","funcionar apenas em residências.","recarregar 100% da bateria em cinco minutos."],"a":1,"e":""},{"t":0,"s":"De acordo com o parágrafo 3, se muitos motoristas carregarem os veículos ao chegar em casa à noite:","o":["os transformadores terão vida útil maior.","a recarga coincidirá com o pico de demanda residencial.","a rede ficará ociosa.","a demanda residencial diminuirá."],"a":1,"e":""},{"t":0,"s":"No parágrafo 3, *which would shorten their lifetime*, o pronome *their* refere-se:","o":["aos transformadores de distribuição.","aos veículos.","aos motoristas.","às residências."],"a":0,"e":""},{"t":0,"s":"Segundo o parágrafo 4, na recarga inteligente o veículo:","o":["pode adiar ou modular a recarga conforme as necessidades da rede.","sempre carrega na potência máxima imediatamente.","nunca carrega à noite.","fornece energia às residências vizinhas."],"a":0,"e":""},{"t":0,"s":"A expressão *provided that* (parágrafo 4) indica:","o":["finalidade (para que).","condição (desde que).","tempo (enquanto).","oposição (embora)."],"a":1,"e":""},{"t":0,"s":"A palavra *reinforcements* (parágrafo 4), no contexto, refere-se a:","o":["baterias mais potentes.","incentivos financeiros.","reforços na infraestrutura da rede.","novos veículos elétricos."],"a":2,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, o conceito de V2G foi inspirado pela observação de que:","o":["os veículos elétricos consomem muita energia.","90% dos carros são elétricos.","os carros particulares ficam estacionados durante mais de 90% do dia.","as baterias se degradam rapidamente."],"a":2,"e":""},{"t":1,"s":"No conceito V2G, os veículos estacionados:","o":["apenas consomem energia da rede.","ficam desconectados da rede.","geram energia a partir do movimento.","retiram energia da rede e também a devolvem quando necessário."],"a":3,"e":""},{"t":1,"s":"De acordo com o parágrafo 2, para o V2G funcionar é necessário que:","o":["os veículos sejam usados continuamente.","não haja fontes renováveis na rede.","o operador controle diretamente o motor dos veículos.","o carregador seja bidirecional e haja padrões comuns de comunicação."],"a":3,"e":""},{"t":1,"s":"A expressão *In principle* (parágrafo 2) indica que a ideia:","o":["foi abandonada.","já foi comprovada em larga escala.","é impossível.","é possível teoricamente."],"a":3,"e":""},{"t":1,"s":"Segundo o parágrafo 3, os proprietários temem que:","o":["ciclos adicionais acelerem a degradação da bateria.","seus carros sejam usados por terceiros.","os carregadores se tornem mais baratos.","a rede fique sobrecarregada."],"a":0,"e":""},{"t":1,"s":"A palavra *Moreover* (parágrafo 3) indica:","o":["contraste.","condição.","adição.","conclusão."],"a":2,"e":""},{"t":1,"s":"Assinale a alternativa que NÃO aparece no Texto 2 como obstáculo ao V2G:","o":["o maior custo dos carregadores bidirecionais.","a baixa autonomia dos veículos elétricos.","a preocupação com a degradação das baterias.","a falta de regras sobre remuneração dos proprietários."],"a":1,"e":"A autonomia não é mencionada."},{"t":1,"s":"No parágrafo 3, *the services they provide*, o pronome *they* refere-se:","o":["aos carregadores bidirecionais.","aos marcos regulatórios.","aos países.","aos proprietários dos veículos."],"a":3,"e":""},{"t":1,"s":"Segundo o parágrafo 4, os projetos-piloto mostraram que o V2G:","o":["já é adotado em larga escala.","é inviável tecnicamente.","é economicamente atrativo.","é tecnicamente viável."],"a":3,"e":""},{"t":1,"s":"De acordo com o parágrafo 4, a atratividade econômica do V2G dependerá, entre outros fatores:","o":["da disposição dos motoristas em ceder parte do controle sobre seus veículos.","da proibição de carregadores rápidos.","do aumento do preço das baterias.","do fim dos projetos-piloto."],"a":0,"e":""}],"w":["Em inglês, explique como a recarga inteligente (smart charging) pode evitar a sobrecarga das redes de distribuição.","Em inglês, apresente sua opinião sobre o conceito vehicle-to-grid (V2G): você permitiria que seu carro fornecesse energia à rede? Justifique."]},{"t":"Comunicações móveis 5G","en":"5G and massive MIMO","x":[{"h":"What Makes 5G Different","p":["Each new generation of mobile networks has been driven by a dominant application. The second generation made digital voice calls widespread, while the fourth generation enabled mobile internet and video streaming. The fifth generation (5G), in contrast, was designed to serve very different applications at the same time.","The 5G standard defines three main usage scenarios. Enhanced mobile broadband aims at higher data rates for smartphones. Ultra-reliable low-latency communication targets applications such as industrial automation and remote surgery, in which a delay of a few milliseconds may be critical. Finally, massive machine-type communication is intended to connect billions of low-cost sensors.","To achieve higher data rates, 5G uses wider frequency bands, including millimeter waves above 24 GHz. These frequencies offer large bandwidths, but they suffer from high path loss and are easily blocked by walls, trees and even the human body. Consequently, millimeter-wave networks require a much denser deployment of small cells.","Another important innovation is network slicing, which allows operators to create multiple virtual networks on the same physical infrastructure. Each slice can be configured with specific performance characteristics, so that a factory and a video streaming service can share the infrastructure without interfering with each other."]},{"h":"Massive MIMO","p":["Multiple-input multiple-output (MIMO) systems use several antennas at the transmitter and the receiver to improve the performance of wireless links. Massive MIMO takes this idea further by equipping base stations with dozens or even hundreds of antennas.","With so many antennas, the base station can perform beamforming, that is, it can concentrate the radiated energy in the direction of each user instead of spreading it in all directions. This increases the received signal strength and reduces interference to other users. In addition, the base station can serve many users simultaneously on the same frequency, a technique known as spatial multiplexing.","The performance of massive MIMO depends on accurate knowledge of the channel. In time-division duplex systems, the base station estimates the channel from pilot signals transmitted by the users and, assuming reciprocity, uses the same estimate for the downlink. However, since the number of available pilot sequences is limited, users in neighboring cells may reuse the same pilots, causing a problem called pilot contamination.","Despite these challenges, massive MIMO has moved from theory to practice in less than a decade. It is now considered one of the key technologies of 5G and is expected to play an even larger role in future networks."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, diferentemente das gerações anteriores, o 5G:","o":["foi projetado para atender aplicações muito diferentes ao mesmo tempo.","foi criado apenas para chamadas de voz.","tem como aplicação dominante o streaming de vídeo.","substituiu completamente o 4G."],"a":0,"e":""},{"t":0,"s":"No parágrafo 1, *in contrast* indica:","o":["oposição.","conclusão.","exemplo.","adição."],"a":0,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, a comunicação ultraconfiável de baixa latência destina-se a aplicações como:","o":["automação industrial e cirurgia remota.","chamadas de voz digitais.","sensores de baixo custo.","smartphones e streaming."],"a":0,"e":""},{"t":0,"s":"Segundo o Texto 1, a comunicação massiva do tipo máquina tem como objetivo:","o":["reduzir a latência em cirurgias.","criar redes virtuais.","conectar bilhões de sensores de baixo custo.","aumentar as taxas de dados dos smartphones."],"a":2,"e":""},{"t":0,"s":"A expressão *a delay of a few milliseconds* (parágrafo 2) refere-se a:","o":["uma distância de alguns metros.","um atraso de alguns milissegundos.","uma taxa de alguns megabits.","uma frequência de alguns megahertz."],"a":1,"e":""},{"t":0,"s":"Segundo o parágrafo 3, as ondas milimétricas:","o":["atravessam paredes com facilidade.","operam abaixo de 1 GHz.","exigem menos células.","oferecem grandes larguras de banda, mas sofrem alta perda e bloqueio."],"a":3,"e":""},{"t":0,"s":"A palavra *Consequently* (parágrafo 3) introduz:","o":["uma comparação com o 4G.","uma exceção às ondas milimétricas.","uma definição de largura de banda.","uma consequência: a necessidade de células pequenas mais densas."],"a":3,"e":""},{"t":0,"s":"De acordo com o parágrafo 4, o fatiamento de rede (*network slicing*) permite:","o":["eliminar as células pequenas.","aumentar a potência das antenas.","dividir o espectro entre países.","criar várias redes virtuais na mesma infraestrutura física."],"a":3,"e":""},{"t":0,"s":"No parágrafo 4, *so that* indica:","o":["tempo.","oposição.","finalidade/resultado.","comparação."],"a":2,"e":""},{"t":0,"s":"No parágrafo 3, a palavra *even* em 'even the human body' enfatiza que:","o":["o corpo humano amplifica o sinal.","apenas o corpo humano bloqueia o sinal.","o corpo humano nunca bloqueia o sinal.","até mesmo o corpo humano pode bloquear o sinal."],"a":3,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, o MIMO massivo:","o":["usa apenas uma antena no transmissor.","é uma técnica exclusiva do 2G.","equipa as estações rádio-base com dezenas ou centenas de antenas.","elimina antenas no receptor."],"a":2,"e":""},{"t":1,"s":"De acordo com o parágrafo 2, *beamforming* consiste em:","o":["desligar antenas não utilizadas.","aumentar o número de frequências.","espalhar a energia em todas as direções.","concentrar a energia irradiada na direção de cada usuário."],"a":3,"e":"'that is, it can concentrate the radiated energy in the direction of each user'."},{"t":1,"s":"A expressão *that is* (parágrafo 2) é usada para:","o":["introduzir uma explicação.","apresentar uma conclusão.","indicar oposição.","expressar dúvida."],"a":0,"e":"'That is' = isto é."},{"t":1,"s":"Segundo o Texto 2, a multiplexação espacial permite:","o":["reduzir o número de antenas.","atender vários usuários simultaneamente na mesma frequência.","usar uma frequência diferente para cada usuário.","aumentar a interferência entre usuários."],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 3, o desempenho do MIMO massivo depende:","o":["do uso de frequências abaixo de 1 GHz.","do número de usuários por célula.","do conhecimento preciso do canal.","da ausência de sinais piloto."],"a":2,"e":""},{"t":1,"s":"De acordo com o Texto 2, nos sistemas TDD a estação rádio-base:","o":["usa sinais piloto exclusivos para cada célula do mundo.","estima o canal a partir de sinais piloto dos usuários e, assumindo reciprocidade, usa a mesma estimativa no enlace de descida.","estima o canal apenas no enlace de descida.","não precisa estimar o canal."],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 3, a contaminação de pilotos ocorre porque:","o":["a reciprocidade do canal é perfeita.","usuários de células vizinhas podem reutilizar as mesmas sequências piloto.","os pilotos são ilimitados.","as antenas estão muito distantes."],"a":1,"e":""},{"t":1,"s":"No parágrafo 3, *since* em 'since the number of available pilot sequences is limited' tem sentido de:","o":["embora (concessão).","já que (causa).","a menos que (condição).","desde (tempo)."],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 4, o MIMO massivo:","o":["foi abandonado no 5G.","levou mais de trinta anos para ser implementado.","passou da teoria à prática em menos de uma década.","ainda é apenas teórico."],"a":2,"e":""},{"t":1,"s":"A expressão *is expected to play an even larger role* (parágrafo 4) significa que se espera que o MIMO massivo:","o":["tenha um papel ainda maior nas redes futuras.","seja substituído rapidamente.","perca importância nas redes futuras.","seja usado apenas em testes."],"a":0,"e":""}],"w":["Em inglês, descreva os três principais cenários de uso do 5G e dê um exemplo de aplicação para cada um.","Em inglês, explique o que é beamforming e por que essa técnica melhora o desempenho de sistemas sem fio."]},{"t":"Processamento digital de sinais","en":"Sampling and digital filters","x":[{"h":"From Analog to Digital","p":["Most physical quantities, such as sound, temperature and voltage, vary continuously in time. In order to be processed by computers, these signals must first be converted into sequences of numbers. This conversion involves two operations: sampling, which records the value of the signal at discrete instants, and quantization, which represents each value with a finite number of bits.","The Nyquist-Shannon sampling theorem states that a band-limited signal can be perfectly reconstructed from its samples if the sampling frequency is greater than twice its highest frequency component. If this condition is not satisfied, high-frequency components appear as lower frequencies in the sampled signal, a distortion known as aliasing.","Because real signals are rarely band-limited, an analog low-pass filter, called an anti-aliasing filter, is placed before the converter. Its role is to attenuate the components above half the sampling frequency. Once aliasing has occurred, it cannot be removed by any subsequent processing.","Quantization, in turn, introduces an error that behaves approximately like noise. Each additional bit of resolution reduces this noise by about 6 dB. Therefore, the choice of the number of bits is a trade-off between signal quality, on the one hand, and cost and data volume, on the other."]},{"h":"FIR and IIR Filters","p":["Digital filters are among the most common tools in signal processing. They are used to remove noise, separate frequency bands and shape the spectrum of signals in applications ranging from audio equipment to biomedical instruments.","There are two main classes of digital filters. Finite impulse response (FIR) filters compute each output sample as a weighted sum of a finite number of input samples. Infinite impulse response (IIR) filters, on the other hand, also use previous output samples, which means that their response to an impulse may, in theory, last forever.","Each class has its own strengths. FIR filters are always stable and can be designed with an exactly linear phase, which preserves the shape of waveforms. This property is essential in applications such as electrocardiography, where distortions of the waveform could lead to incorrect diagnoses. IIR filters, by contrast, can achieve a sharp frequency response with far fewer coefficients, which reduces the computational load.","The main disadvantage of IIR filters is that they may become unstable, particularly when their coefficients are represented with limited precision. Designers must therefore verify that all poles of the filter remain inside the unit circle after quantization."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, para serem processados por computadores, os sinais contínuos devem:","o":["ser transmitidos sem fio.","ter frequência infinita.","ser convertidos em sequências de números.","ser amplificados."],"a":2,"e":""},{"t":0,"s":"De acordo com o Texto 1, a quantização consiste em:","o":["reconstruir o sinal original.","filtrar componentes de alta frequência.","registrar o sinal em instantes discretos.","representar cada valor com um número finito de bits."],"a":3,"e":""},{"t":0,"s":"Segundo o teorema de Nyquist-Shannon, um sinal limitado em banda pode ser reconstruído perfeitamente se:","o":["a frequência de amostragem for maior que o dobro da maior componente de frequência.","o sinal tiver muitos bits.","a frequência de amostragem for igual à maior componente de frequência.","não houver filtro anti-aliasing."],"a":0,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, o *aliasing* é uma distorção em que:","o":["o sinal perde bits de resolução.","o ruído aumenta 6 dB.","as frequências baixas são eliminadas.","componentes de alta frequência aparecem como frequências mais baixas."],"a":3,"e":""},{"t":0,"s":"No parágrafo 2, *If this condition is not satisfied*, a expressão *this condition* refere-se:","o":["ao filtro passa-baixas.","à amostragem com frequência maior que o dobro da maior componente.","à quantização com poucos bits.","ao ruído de quantização."],"a":1,"e":""},{"t":0,"s":"Segundo o parágrafo 3, o filtro anti-aliasing é colocado antes do conversor porque:","o":["o conversor exige sinais quantizados.","os sinais reais raramente são limitados em banda.","os sinais reais nunca têm altas frequências.","o aliasing pode ser removido posteriormente."],"a":1,"e":""},{"t":0,"s":"De acordo com o parágrafo 3, depois que o aliasing ocorre:","o":["pode ser eliminado com filtros digitais.","desaparece com mais bits.","é corrigido pelo teorema de Nyquist.","não pode ser removido por nenhum processamento posterior."],"a":3,"e":""},{"t":0,"s":"Segundo o parágrafo 4, cada bit adicional de resolução:","o":["aumenta o ruído em 6 dB.","reduz o ruído de quantização em cerca de 6 dB.","elimina o aliasing.","dobra a frequência de amostragem."],"a":1,"e":""},{"t":0,"s":"A expressão *in turn* (parágrafo 4) é usada para:","o":["indicar oposição ao parágrafo anterior.","introduzir o próximo tópico, a qua
