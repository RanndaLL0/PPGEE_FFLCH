lês, explique o que é uma microrrede e por que ela pode ser útil para comunidades isoladas da Amazônia.","Em inglês, descreva o princípio do controle por droop e explique por que são necessárias camadas adicionais de controle."]},{"t":"Qualidade de energia","en":"Power quality and harmonics","x":[{"h":"When Voltage Is Not Just Voltage","p":["Ideally, the voltage supplied by the grid would be a perfect sinusoid with constant amplitude and frequency. In practice, however, many phenomena distort it. The field of power quality studies these disturbances, their causes and their effects on equipment.","Voltage sags, also called dips, are among the most frequent and costly disturbances. They are short reductions in the voltage, typically lasting from a few cycles to a few seconds, and are usually caused by faults elsewhere in the network or by the starting of large motors. Although they may seem harmless, sags can stop production lines, reset computers and cause significant economic losses in sensitive industries.","Other common problems include voltage swells, transients caused by lightning or switching operations, and flicker, which is a rapid fluctuation of voltage that makes lights visibly unstable. Flicker is often caused by loads with highly variable consumption, such as arc furnaces.","Since the consequences of poor power quality are shared between utilities and customers, regulatory agencies define limits for each type of disturbance. In Brazil, these limits are established in the PRODIST procedures published by ANEEL."]},{"h":"Harmonics from Nonlinear Loads","p":["Traditional loads, such as incandescent lamps and resistive heaters, draw a current proportional to the applied voltage. Modern electronic equipment, by contrast, behaves as a nonlinear load. Computers, LED lamps, variable-speed drives and battery chargers draw current in short pulses, which contain components at multiples of the fundamental frequency, known as harmonics.","Harmonic currents cause several problems. They increase losses in transformers and cables, which may overheat even when the total power is within their rating. Triplen harmonics, those whose order is a multiple of three, add up in the neutral conductor of three-phase systems instead of canceling, and can overload it.","Furthermore, when harmonic currents flow through the impedance of the network, they distort the voltage, affecting other consumers connected to the same feeder. In some cases, the interaction between capacitor banks and the inductance of the network creates a resonance that amplifies a particular harmonic.","Harmonic mitigation can be achieved in different ways. Passive filters, composed of inductors and capacitors tuned to specific frequencies, are simple and inexpensive. Active filters, on the other hand, inject currents that cancel the harmonics measured in real time, adapting automatically to changes in the load, but at a higher cost."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, idealmente a tensão da rede seria:","o":["uma onda quadrada.","uma onda com muitos harmônicos.","uma tensão contínua.","uma senoide perfeita com amplitude e frequência constantes."],"a":3,"e":""},{"t":0,"s":"A área de qualidade de energia estuda:","o":["apenas o preço da energia.","a construção de usinas.","os distúrbios na tensão, suas causas e efeitos nos equipamentos.","o consumo residencial."],"a":2,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, os afundamentos de tensão (*sags*) são geralmente causados por:","o":["faltas em outros pontos da rede ou partida de grandes motores.","descargas atmosféricas diretas no consumidor.","lâmpadas incandescentes.","excesso de tensão na rede."],"a":0,"e":""},{"t":0,"s":"Segundo o Texto 1, os afundamentos de tensão duram tipicamente:","o":["de alguns ciclos a alguns segundos.","várias horas.","alguns dias.","menos de um microssegundo."],"a":0,"e":""},{"t":0,"s":"No parágrafo 2, *Although they may seem harmless* significa:","o":["Embora possam parecer inofensivos","Porque são perigosos","Como são inofensivos","Se forem inofensivos"],"a":0,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, os afundamentos podem:","o":["parar linhas de produção e reiniciar computadores.","melhorar a eficiência dos motores.","reduzir as perdas econômicas.","eliminar transitórios."],"a":0,"e":""},{"t":0,"s":"Segundo o parágrafo 3, o *flicker* é:","o":["uma elevação permanente de tensão.","um harmônico de terceira ordem.","um tipo de descarga atmosférica.","uma flutuação rápida da tensão que torna a iluminação visivelmente instável."],"a":3,"e":""},{"t":0,"s":"De acordo com o Texto 1, os fornos a arco são citados como:","o":["solução para afundamentos.","causa frequente de flicker.","exemplo de carga linear.","fonte de transitórios atmosféricos."],"a":1,"e":""},{"t":0,"s":"Segundo o parágrafo 4, as agências reguladoras definem limites porque:","o":["não há distúrbios no Brasil.","as consequências da má qualidade de energia são compartilhadas entre concessionárias e consumidores.","os consumidores não são afetados.","as concessionárias não têm responsabilidade."],"a":1,"e":""},{"t":0,"s":"De acordo com o texto, no Brasil os limites de qualidade de energia estão no:","o":["regulamento das concessionárias estrangeiras.","PRODIST, publicado pela ANEEL.","código de defesa do consumidor.","manual dos fabricantes."],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, as cargas tradicionais, como lâmpadas incandescentes:","o":["são cargas não lineares.","consomem corrente proporcional à tensão aplicada.","geram muitos harmônicos.","consomem corrente em pulsos curtos."],"a":1,"e":""},{"t":1,"s":"De acordo com o Texto 2, os harmônicos são:","o":["cargas lineares.","variações lentas da tensão.","tipos de afundamento.","componentes em múltiplos da frequência fundamental."],"a":3,"e":""},{"t":1,"s":"Assinale a alternativa que NÃO é citada no parágrafo 1 como carga não linear:","o":["carregadores de baterias.","lâmpadas LED.","aquecedores resistivos.","computadores."],"a":2,"e":""},{"t":1,"s":"Segundo o parágrafo 2, as correntes harmônicas podem fazer transformadores e cabos:","o":["dispensarem manutenção.","aquecerem mesmo com a potência total dentro do valor nominal.","operarem com menos perdas.","reduzirem a temperatura."],"a":1,"e":""},{"t":1,"s":"De acordo com o Texto 2, os harmônicos triplos (*triplen*):","o":["não existem em sistemas trifásicos.","reduzem a corrente no neutro.","cancelam-se sempre no neutro.","somam-se no condutor neutro em vez de se cancelarem."],"a":3,"e":""},{"t":1,"s":"No parágrafo 2, *those whose order is a multiple of three*, o termo *those* refere-se:","o":["aos transformadores.","aos sistemas trifásicos.","aos harmônicos.","aos condutores."],"a":2,"e":""},{"t":1,"s":"Segundo o parágrafo 3, quando correntes harmônicas passam pela impedância da rede:","o":["distorcem a tensão e afetam outros consumidores.","só afetam o próprio consumidor.","melhoram a qualidade da tensão.","são eliminadas automaticamente."],"a":0,"e":""},{"t":1,"s":"De acordo com o Texto 2, a ressonância mencionada no parágrafo 3 resulta da interação entre:","o":["o neutro e a terra.","lâmpadas e motores.","filtros ativos e passivos.","bancos de capacitores e a indutância da rede."],"a":3,"e":""},{"t":1,"s":"Segundo o parágrafo 4, os filtros passivos:","o":["injetam correntes que cancelam harmônicos em tempo real.","adaptam-se automaticamente à carga.","são simples e baratos, compostos por indutores e capacitores sintonizados.","são mais caros que os ativos."],"a":2,"e":""},{"t":1,"s":"De acordo com o Texto 2, os filtros ativos:","o":["não medem os harmônicos.","são mais baratos que os passivos.","adaptam-se automaticamente às mudanças na carga, mas custam mais.","são compostos apenas por capacitores."],"a":2,"e":""}],"w":["Em inglês, explique o que são afundamentos de tensão (voltage sags) e por que eles preocupam indústrias sensíveis.","Em inglês, descreva como cargas eletrônicas não lineares geram harmônicos e cite duas formas de mitigá-los."]},{"t":"Antenas e arranjos de fase","en":"Antennas and phased arrays","x":[{"h":"The Antenna: Where Circuits Meet Space","p":["An antenna is the interface between a guided wave in a transmission line and an electromagnetic wave propagating in free space. Every wireless system, from a garage door opener to a deep-space probe, depends on at least one antenna to transmit or receive signals.","Antennas are characterized by several parameters. The radiation pattern describes how the radiated power is distributed in different directions. Gain combines the directivity of the antenna, that is, its ability to concentrate energy in a given direction, with its efficiency. Bandwidth indicates the range of frequencies over which the antenna performs adequately.","The size of an antenna is closely related to the wavelength of the signal. A half-wave dipole, one of the simplest antennas, has a length of about half a wavelength. For this reason, antennas for low frequencies, such as AM radio, are very large, whereas those used in mobile phones can be only a few centimeters long.","Designing compact antennas for modern devices is a demanding task. A smartphone must support many frequency bands and several antennas must coexist in a small volume, surrounded by metal parts, a battery and the user's hand, all of which affect performance."]},{"h":"Steering Beams Without Moving Parts","p":["Traditional radar systems use large dish antennas that rotate mechanically to scan the sky. Although effective, these systems are relatively slow and require maintenance of moving parts. Phased arrays offer an alternative: they consist of many small antenna elements whose signals are combined electronically.","By adjusting the phase of the signal fed to each element, the array can steer its main beam in different directions without any mechanical movement. Since the phase can be changed in microseconds, the beam can jump from one direction to another almost instantly and even track several targets at the same time.","For a long time, the high cost of phased arrays restricted their use to military applications. Each element required its own phase shifter and, in active arrays, its own transmit and receive module. Advances in integrated circuits, particularly in silicon technologies, have reduced these costs dramatically.","As a result, phased arrays are now found in civilian applications such as satellite internet terminals, 5G base stations and automotive radars. Nevertheless, challenges remain, including mutual coupling between closely spaced elements and the need to dissipate the heat generated by hundreds of active modules."]}],"q":[{"t":0,"s":"Segundo o parágrafo 1 do Texto 1, uma antena é:","o":["um tipo de linha de transmissão.","a interface entre uma onda guiada em uma linha de transmissão e uma onda no espaço livre.","um amplificador de sinais elétricos.","um dispositivo exclusivo de sondas espaciais."],"a":1,"e":""},{"t":0,"s":"A expressão *from a garage door opener to a deep-space probe* indica:","o":["a diversidade de sistemas sem fio que dependem de antenas.","que portões de garagem dispensam antenas.","que apenas sondas espaciais usam antenas.","uma ordem cronológica de invenções."],"a":0,"e":""},{"t":0,"s":"De acordo com o parágrafo 2, o diagrama de radiação descreve:","o":["a faixa de frequências da antena.","como a potência irradiada se distribui nas diferentes direções.","o tamanho físico da antena.","a eficiência da linha de transmissão."],"a":1,"e":""},{"t":0,"s":"Segundo o Texto 1, o ganho de uma antena combina:","o":["a largura de banda e o tamanho.","o comprimento de onda e a frequência.","a diretividade e a eficiência.","a potência e a tensão."],"a":2,"e":""},{"t":0,"s":"No parágrafo 2, *that is* introduz:","o":["uma explicação do termo diretividade.","uma oposição.","uma conclusão.","um exemplo de antena."],"a":0,"e":""},{"t":0,"s":"De acordo com o parágrafo 3, um dipolo de meia onda tem comprimento de:","o":["alguns milímetros, sempre.","dez comprimentos de onda.","um comprimento de onda inteiro.","aproximadamente metade do comprimento de onda."],"a":3,"e":""},{"t":0,"s":"Segundo o Texto 1, antenas para baixas frequências, como rádio AM, são muito grandes porque:","o":["são mais antigas.","usam mais potência.","o tamanho da antena está relacionado ao comprimento de onda.","precisam de muitos elementos."],"a":2,"e":""},{"t":0,"s":"No parágrafo 3, *whereas* estabelece:","o":["causa e efeito.","adição de exemplos.","condição.","contraste entre antenas de baixa frequência e antenas de celulares."],"a":3,"e":""},{"t":0,"s":"Segundo o parágrafo 4, projetar antenas para smartphones é difícil porque:","o":["não há espaço para a bateria.","várias antenas devem coexistir em pequeno volume, cercadas por elementos que afetam o desempenho.","a mão do usuário melhora o desempenho.","os smartphones usam apenas uma frequência."],"a":1,"e":""},{"t":0,"s":"A expressão *all of which* (parágrafo 4) refere-se:","o":["às antenas apenas.","às bandas de frequência.","às partes metálicas, à bateria e à mão do usuário.","aos smartphones."],"a":2,"e":""},{"t":1,"s":"Segundo o parágrafo 1 do Texto 2, os radares tradicionais:","o":["não têm partes móveis.","são instantâneos.","usam arranjos de fase.","usam grandes antenas parabólicas que giram mecanicamente."],"a":3,"e":""},{"t":1,"s":"De acordo com o Texto 2, os arranjos de fase são compostos por:","o":["antenas de rádio AM.","muitos pequenos elementos de antena cujos sinais são combinados eletronicamente.","uma única antena parabólica.","motores e engrenagens."],"a":1,"e":""},{"t":1,"s":"Segundo o parágrafo 2, o feixe principal é direcionado:","o":["girando o arranjo mecanicamente.","aumentando a potência de um único elemento.","ajustando a fase do sinal em cada elemento.","desligando metade dos elementos."],"a":2,"e":""},{"t":1,"s":"De acordo com o Texto 2, como a fase pode ser alterada em microssegundos, o feixe:","o":["demora minuto   d.addEventListener('click', e => { if (e.target === d) d.remove(); });
  d.addEventListener('keydown', e => { if (e.key === 'Escape') d.remove(); });

    : '<li>Leia os dois textos da parte 1. As propostas de escrita tratam dos mesmos temas.</li><li>Escreva os dois textos em inglês, cada um com 100 a 120 palavras.</li><li>O corretor ortográfico fica desligado, como na prova em papel. O dicionário físico é permitido.</li><li>Ao finalizar, revise cada texto com o roteiro de autoavaliação.</li>';
  app.innerHTML = '<main class="wrap"><section class="intro">' +
    '<button class="btn quiet" onclick="home()">Voltar à lista</button>' +
    '<h1>' + num(i) + ': ' + esc(e.t) + '</h1>' + prev +
    '<ol>' + steps + '</ol>' +
    '<label class="check"><input type="checkbox" id="timed" checked> Cronometrar 2 horas, como na prova</label>' +
    '<div class="actions"><button class="btn primary" onclick="begin()">' + (p1 ? 'Começar a parte 1' : 'Começar a parte 2') + '</button></div>' +
  '</section></main>';
  toTop();
}
function begin(){
  S.timed = document.getElementById('timed').checked; S.left = DUR; S.el = 0; S.tab = 0; S.pane = 't'; S.paused = false;
  if (store.mode === 'p1'){ S.ans = new Array(DATA[S.i].q.length).fill(null); exam(); } else writing();
}

/* ---------- shared pieces ---------- */
function readerHTML(e){
  const x = e.x[S.tab];
  return '<div class="tabs" role="tablist" aria-label="Textos">' + e.x.map((_,k) => '<button role="tab" aria-selected="' + (S.tab===k) + '" onclick="setTab(' + k + ')">Texto ' + (k+1) + '</button>').join('') + '</div>' +
    '<article class="text" lang="en"><h2>' + esc(x.h) + '</h2>' + x.p.map((p,n) => '<p><span class="pn" aria-label="Parágrafo ' + (n+1) + '">' + (n+1) + '</span>' + esc(p) + '</p>').join('') + '</article>';
}
function setTab(k, jump){
  S.tab = k; const r = document.getElementById('reader');
  r.innerHTML = readerHTML(DATA[S.i]); r.scrollTop = 0;
  if (jump && window.matchMedia('(max-width:980px)').matches){ setPane('t'); toTop(); }
}
function setPane(p){
  S.pane = p; const sp = document.getElementById('split'); if (sp) sp.dataset.pane = p;
  document.querySelectorAll('.paneswitch button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === p));
}
function bar(title, right){
  return '<header class="bar"><div class="wide barin"><button class="btn quiet" onclick="leave()">Sair</button><div class="bt"><b>' + num(S.i) + '</b><span>' + esc(DATA[S.i].t) + '</span></div>' + right + '</div></header>';
}
function paneSwitch(second){
  return '<div class="paneswitch" role="tablist"><button data-p="t" role="tab" aria-selected="' + (S.pane==='t') + '" onclick="setPane(\'t\')">Textos</button><button data-p="q" role="tab" aria-selected="' + (S.pane==='q') + '" onclick="setPane(\'q\')">' + second + '</button></div>';
}
function leave(){
  if (S.view === 'result' || S.view === 'wdone'){ home(); return; }
  modal('Sair do simulado?', 'Seu progresso fica salvo neste navegador e você pode continuar depois pela lista.', [{label:'Cancelar'},{label:'Sair', primary:true, fn:() => { saveCur(); home(); }}]);
}

/* ---------- part 1 ---------- */
function exam(){
  S.view = 'exam'; const e = DATA[S.i];
  const qs = e.q.map((q,i) => {
    const head = i === 0 ? '<p class="group">Questões 1 a 10, sobre o Texto 1</p>' : i === 10 ? '<p class="group">Questões 11 a 20, sobre o Texto 2</p>' : '';
    return head + '<div class="q" id="q' + i + '" role="radiogroup" aria-labelledby="qt' + i + '"><div class="qh"><span class="qn">' + (i+1) + '</span><p class="qs-text" id="qt' + i + '">' + fmtq(q.s) + '</p><button class="tref" onclick="setTab(' + q.t + ',true)">Texto ' + (q.t+1) + '</button></div>' +
      q.o.map((o,j) => '<label class="opt"><input type="radio" name="r' + i + '" value="' + j + '"' + (S.ans[i]===j ? ' checked' : '') + ' onchange="pick(' + i + ',' + j + ')"><span class="bub" aria-hidden="true">' + L[j] + '</span><span class="ot"><span class="sr">' + L[j] + ') </span>' + fmtq(o) + '</span></label>').join('') + '</div>';
  }).join('');
  app.innerHTML = bar('', '<div class="clock" id="clock" role="timer"></div><button class="btn quiet hide-sm" onclick="togglePause()">Pausar</button><span class="prog" id="prog"></span><button class="btn primary" onclick="askSubmit()">Entregar</button>') +
    paneSwitch('Questões') +
    '<main class="split sheeted wide" id="split" data-pane="' + S.pane + '"><section class="reader" id="reader">' + readerHTML(e) + '</section>' +
    '<section class="main">' + qs + '<div class="actions" style="justify-content:flex-end;margin-top:20px"><button class="btn primary" onclick="askSubmit()">Entregar prova</button></div></section>' +
    '<aside class="sheet" aria-label="Cartão-resposta"><h3>Cartão-resposta</h3><div id="sheet"></div></aside></main>';
  paintSheet(); paintProg(); paintClock(); startTick(); toTop();
}
function paintSheet(){
  const el = document.getElementById('sheet'); if (!el) return;
  el.innerHTML = S.ans.map((a,i) => '<div class="srow"><a href="#q' + i + '">' + (i+1) + '</a>' + [0,1,2,3].map(j => '<button class="' + (a===j ? 'on' : '') + '" aria-label="Questão ' + (i+1) + ', alternativa ' + L[j] + '" onclick="pick(' + i + ',' + j + ',true)">' + L[j] + '</button>').join('') + '</div>').join('');
}
function paintProg(){ const p = document.getElementById('prog'); if (p) p.textContent = S.ans.filter(a => a !== null).length + '/20 respondidas'; }
function pick(i, j, fromSheet){
  S.ans[i] = j;
  if (fromSheet){ const r = document.querySelector('input[name="r' + i + '"][value="' + j + '"]'); if (r) r.checked = true; }
  paintSheet(); paintProg(); saveCur();
}
function askSubmit(){
  const un = S.ans.filter(a => a === null).length;
  modal('Entregar a prova?', un ? 'Há ' + un + ' questão' + (un > 1 ? 'ões' : '') + ' sem resposta. Na prova real, deixar em branco conta como erro.' : 'Todas as 20 questões foram respondidas.', [{label:'Continuar respondendo'},{label:'Entregar', primary:true, fn:() => submit(false)}]);
}
function submit(auto){
  stopTick(); if (S.paused) togglePause();
  const e = DATA[S.i];
  const pat = e.q.map((q,i) => S.ans[i] === q.a ? 1 : 0);
  const score = pat.reduce((s,v) => s+v, 0);
  const r = store.res[S.i] || {best:0, att:0};
  r.best = Math.max(r.best, score); r.last = score; r.att++; r.pat = pat; r.ans = S.ans.slice(); r.used = S.el; r.at = Date.now();
  store.res[S.i] = r; delete store.cur; persist();
  S.last = {auto, score, pat}; S.onlyWrong = false; S.tab = 0; S.pane = 'q';
  result();
}
function result(){
  S.view = 'result'; const e = DATA[S.i], r = store.res[S.i], ans = r.ans, pat = r.pat;
  const score = r.last, pct = score * 5;
  const t1 = pat.slice(0,10).reduce((s,v)=>s+v,0), t2 = pat.slice(10).reduce((s,v)=>s+v,0);
  const verdict = pct >= 70 ? 'Acima da meta de estudo de 70%.' : pct >= 50 ? 'Perto da meta. Revise os erros e refaça em alguns dias.' : 'Abaixo da meta. Releia os textos com calma usando as explicações.';
  const items = e.q.map((q,i) => {
    const ok = ans[i] === q.a;
    const head = i === 0 ? '<p class="group">Texto 1</p>' : i === 10 ? '<p class="group">Texto 2</p>' : '';
    return head + '<div class="q rv" data-ok="' + (ok?1:0) + '" id="q' + i + '"><div class="qh"><span class="qn">' + (i+1) + '</span><p class="qs-text">' + fmtq(q.s) + '</p><span class="qmark ' + (ok ? 'ok">Certa' : 'bad">' + (ans[i] === null ? 'Em branco' : 'Errada')) + '</span></div>' +
      q.o.map((o,j) => { const c = j === q.a ? 'ok' : j === ans[i] ? 'bad' : ''; const tag = j === q.a ? '<span class="tag ok">Resposta correta</span>' : j === ans[i] ? '<span class="tag bad">Sua resposta</span>' : ''; return '<div class="opt ' + c + '"><span class="bub">' + L[j] + '</span><span class="ot">' + fmtq(o) + tag + '</span></div>'; }).join('') +
      (q.e ? '<p class="why">' + fmtq(q.e) + '</p>' : '') +
      '<button class="tref" style="margin-top:8px" onclick="setTab(' + q.t + ',true)">Ver Texto ' + (q.t+1) + '</button></div>';
  }).join('');
  const sheet = e.q.map((q,i) => '<div class="srow"><a href="#q' + i + '">' + (i+1) + '</a>' + [0,1,2,3].map(j => { const c = j === q.a ? (ans[i] === j ? 'ok' : 'miss') : (ans[i] === j ? 'bad' : ''); return '<button class="' + c + '" tabindex="-1" aria-hidden="true">' + L[j] + '</button>'; }).join('') + '</div>').join('');
  const next = S.i + 1 < DATA.length ? '<button class="btn" onclick="intro(' + (S.i+1) + ')">Próximo simulado</button>' : '';
  app.innerHTML = bar('', '<button class="btn" onclick="intro(' + S.i + ')">Refazer</button>' + next) +
    '<div class="wide"><section class="summary"><div class="big">' + score + '<small>/20</small></div><div class="sumtext">' +
      '<p><strong>' + pct + '% de acerto.</strong> ' + verdict + '</p>' +
      '<p class="muted">Texto 1: ' + t1 + ' de 10. Texto 2: ' + t2 + ' de 10. Tempo usado: ' + mins(r.used) + (S.last && S.last.auto ? ', entregue automaticamente ao fim do tempo' : '') + '. Melhor nota neste simulado: ' + r.best + '/20.</p>' +
    '</div><span class="strip" aria-hidden="true">' + pat.map(v => '<i class="' + (v ? 'y' : 'n') + '"></i>').join('') + '</span></section></div>' +
    paneSwitch('Correção') +
    '<main class="split sheeted wide" id="split" data-pane="q"><section class="reader" id="reader">' + readerHTML(e) + '</section>' +
    '<section class="main"><label class="filter"><input type="checkbox" onchange="filterWrong(this.checked)"> Mostrar só as questões erradas ou em branco</label>' + items +
    '<div class="actions" style="margin-top:20px"><button class="btn" onclick="home()">Voltar à lista</button><button class="btn primary" onclick="intro(' + S.i + ')">Refazer este simulado</button></div></section>' +
    '<aside class="sheet" aria-label="Gabarito"><h3>Gabarito</h3>' + sheet + '</aside></main>';
  toTop();
}
function filterWrong(on){ document.querySelectorAll('.rv').forEach(el => { el.style.display = on && el.dataset.ok === '1' ? 'none' : ''; }); }

/* ---------- part 2 ---------- */
const CHECK = [
  'Respondi exatamente ao que a proposta pede, sem fugir do tema.',
  'O texto tem entre 100 e 120 palavras.',
  'Usei termos técnicos dos textos, mas não copiei frases inteiras.',
  'Organizei as ideias com conectivos, como however, therefore, moreover e for example.',
  'Toda frase tem sujeito explícito. Evitei construções como "Is important to...", em vez de "It is important to...".',
  'Revisei a concordância (it works, they work), os tempos verbais e o uso de artigos.',
  'O texto tem uma frase de abertura clara e uma conclusão.'
];
const PHRASES = ['The main advantage of ... is that ...','One of the most important challenges is ...','This is mainly due to ...','As a result, ... / Consequently, ...','On the one hand, ... On the other hand, ...','However, / Nevertheless, ...','For instance, / For example, ...','In addition, / Moreover, ...','In my opinion, ... because ...','In conclusion, / To sum up, ...'];
function writing(){
  S.view = 'write'; const e = DATA[S.i], d = store.dr[S.i] || ['',''];
  const tasks = e.w.map((p,k) => '<div class="task"><h3>Produção ' + (k+1) + '</h3><p class="prompt">' + esc(p) + '</p>' +
    '<label class="sr" for="w' + k + '">Texto da produção ' + (k+1) + '</label><textarea id="w' + k + '" lang="en" spellcheck="false" autocapitalize="sentences" placeholder="Write your text in English." oninput="onWrite(' + k + ')">' + esc(d[k] || '') + '</textarea>' +
    '<div class="wc" id="wc' + k + '"><span><b>0</b> palavras</span><span class="meter" aria-hidden="true"><i></i></span><span>meta: 100 a 120</span></div></div>').join('');
  app.innerHTML = bar('', '<div class="clock" id="clock" role="timer"></div><button class="btn quiet hide-sm" onclick="togglePause()">Pausar</button><button class="btn primary" onclick="askFinish()">Finalizar</button>') +
    paneSwitch('Redação') +
    '<main class="split wide" id="split" data-pane="' + S.pane + '"><section class="reader" id="reader">' + readerHTML(e) + '</section>' +
    '<section class="main"><p class="note">O texto é salvo automaticamente neste navegador. O corretor ortográfico está desligado, como na prova em papel.</p>' + tasks +
    '<div class="actions" style="justify-content:flex-end"><button class="btn primary" onclick="askFinish()">Finalizar e revisar</button></div></section></main>';
  [0,1].forEach(paintWc); paintClock(); startTick(); toTop();
}
function paintWc(k){
  const t = document.getElementById('w' + k), box = document.getElementById('wc' + k); if (!t || !box) return;
  const n = wc(t.value);
  box.querySelector('b').textContent = n;
  box.querySelector('.meter i').style.width = Math.min(100, n / 140 * 100) + '%';
  box.classList.toggle('good', n >= 100 && n <= 120); box.classList.toggle('over', n > 120);
}
let wTimer = null;
function onWrite(k){
  paintWc(k);
  clearTimeout(wTimer);
  wTimer = setTimeout(() => { store.dr[S.i] = [0,1].map(j => document.getElementById('w' + j).value); saveCur(); persist(); }, 400);
}
function askFinish(){
  const n = [0,1].map(k => wc(document.getElementById('w' + k).value));
  const off = n.filter(x => x < 100 || x > 120).length;
  modal('Finalizar a produção escrita?', off ? 'Pelo menos um texto está fora da faixa de 100 a 120 palavras (' + n[0] + ' e ' + n[1] + ' palavras).' : 'Os dois textos estão na faixa de 100 a 120 palavras.', [{label:'Continuar escrevendo'},{label:'Finalizar', primary:true, fn:() => finishWriting(false)}]);
}
function finishWriting(auto){
  stopTick(); if (S.paused) togglePause();
  const txt = [0,1].map(k => { const t = document.getElementById('w' + k); return t ? t.value : (store.dr[S.i] || ['',''])[k]; });
  store.dr[S.i] = txt; store.wr[S.i] = {wc: txt.map(wc), used:S.el, at:Date.now()}; delete store.cur; persist();
  S.view = 'wdone'; const e = DATA[S.i];
  const blocks = e.w.map((p,k) => { const n = wc(txt[k]); const st = n >= 100 && n <= 120 ? '<span class="tag ok">' + n + ' palavras, dentro da faixa</span>' : '<span class="tag bad">' + n + ' palavras, fora da faixa de 100 a 120</span>';
    return '<div class="task"><h3>Produção ' + (k+1) + st + '</h3><p class="prompt">' + esc(p) + '</p><div class="final" lang="en">' + (txt[k].trim() ? esc(txt[k]) : '<span style="color:var(--muted)">Texto em branco.</span>') + '</div>' +
      '<ul class="checklist">' + CHECK.map(c => '<li><label><input type="checkbox"> <span>' + esc(c) + '</span></label></li>').join('') + '</ul></div>'; }).join('');
  app.innerHTML = bar('', '<button class="btn" onclick="editAgain()">Editar textos</button>') +
    '<main class="wrap" style="padding-top:28px;padding-bottom:64px"><h1 style="font-size:26px;margin:0 0 6px">Revise suas produções</h1><p class="note" style="font-size:16px">' + (auto ? 'O tempo acabou e seus textos foram salvos. ' : '') + 'Tempo usado: ' + mins(S.el) + '. Leia cada texto em voz baixa e marque o que já está bom. O que ficar sem marcar é o que você deve corrigir antes do próximo simulado.</p>' + blocks +
    '<div class="task"><h3>Expressões úteis para a parte 2</h3><ul class="phrases" lang="en">' + PHRASES.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul></div>' +
    '<div class="actions"><button class="btn" onclick="home()">Voltar à lista</button>' + (S.i + 1 < DATA.length ? '<button class="btn primary" onclick="intro(' + (S.i+1) + ')">Próximo simulado</button>' : '') + '</div></main>';
  toTop();
}
function editAgain(){ S.left = Math.max(S.left, 0); S.timed = false; S.pane = 'q'; writing(); }

home();
</script>
</body>
</html>
